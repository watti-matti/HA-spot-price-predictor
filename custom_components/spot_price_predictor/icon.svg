<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Background circle -->
  <circle cx="12" cy="12" r="11" fill="#1a2633" stroke="#3b82f6" stroke-width="0.8"/>

  <!-- Price chart line (rising/falling prediction) -->
  <polyline points="4,16 7,14 9,17 11,11 13,13 15,8 17,10 20,6"
            fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lightning bolt (electricity) -->
  <polygon points="12,3 9,11 12,11 10,21 15,10 12,10"
           fill="#fbbf24" opacity="0.7"/>

  <!-- Small dot at prediction end -->
  <circle cx="20" cy="6" r="1.2" fill="#60a5fa"/>
</svg>
