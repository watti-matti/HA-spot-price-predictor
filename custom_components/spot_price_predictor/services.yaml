upload_coefficients:
  name: Upload Model Coefficients
  description: >
    Upload new model coefficients from a JSON file or inline JSON string.
    Use after retraining the model on your PC with:
    python -m src.train_model --region finland --fingrid-key YOUR_KEY
  fields:
    file_path:
      name: File Path
      description: >
        Path to the model_coefs.json file on the HA host filesystem.
        Example: /config/model_coefs.json
      required: false
      example: "/config/model_coefs.json"
      selector:
        text:
    json_data:
      name: JSON Data
      description: >
        Raw JSON string containing model coefficients.
        Use this if you cannot place the file on the HA filesystem.
      required: false
      selector:
        text:
          multiline: true

reset_coefficients:
  name: Reset to Default Coefficients
  description: >
    Remove any user-uploaded coefficients and revert to the bundled
    default model. The integration will reload automatically.

model_info:
  name: Show Model Information
  description: >
    Display current model information as a persistent notification,
    including version, feature count, accuracy metrics, and
    retraining instructions.

force_refresh:
  name: Force Refresh
  description: >
    Trigger an immediate data refresh outside the normal 6-hour cycle.
    Fetches fresh weather, spot prices, and cross-border data, then
    reruns model inference. Useful for debugging or after network recovery.

retrain_models:
  name: Retrain prediction model artifacts
  description: >
    Refit the L1 seasonal components, L2+L3+L4 spike-tail model, and
    (optionally) the solar sub-model from the latest cached data.
    Replaces the shipped JSON artifacts atomically and reloads the
    prediction pipeline on every active coordinator without an HA
    restart. Fires the spot_price_predictor_models_retrained event on
    completion.
  fields:
    layers:
      name: Layers to retrain
      description: >
        Subset of {seasonal, spike, solar}. If omitted, all three are
        retrained. The "solar" layer requires a Fingrid API key.
      required: false
      example: '["seasonal", "spike"]'
      selector:
        select:
          multiple: true
          options:
            - "seasonal"
            - "spike"
            - "solar"
    fingrid_api_key:
      name: Fingrid API key (solar layer only)
      description: >
        Free instant key at https://developer-data.fingrid.fi/. If
        omitted, the FINGRID_API_KEY env var is used. If neither is
        available, the solar layer is skipped (other layers proceed).
      required: false
      selector:
        text:
