# ============================================================
# Home Assistant Dashboard — Spot Price Predictor
# ============================================================
#
# Prerequisites (install via HACS Frontend):
#   - apexcharts-card (https://github.com/RomRider/apexcharts-card)
#   - mushroom (https://github.com/piitaya/lovelace-mushroom)
#
# Sensors used:
#   - sensor.spot_price_predictor_price_forecast
#     State: current consumer price (c/kWh)
#     Attributes: forecast[] (170h array with spot_eur_mwh, consumer_ckwh,
#                 wind, solar, temp), week_min/avg/max_ckwh
#
#   - sensor.spot_price_predictor_duration_forecast
#     State: today D(4) (c/kWh)
#     Attributes: daily_forecast[] (7-day D(k) curves), today_d1/d4/d8/d24
#
# Optimization (cheapest hours, load scheduling) is NOT part of this
# integration — it belongs in a separate thermal optimization layer.
# ============================================================

title: Electricity Forecast
views:
  - title: Electricity
    icon: mdi:flash
    type: sections
    max_columns: 2
    sections:

      # ── Left column: hourly price charts ──
      - title: ""
        cards:

          # ── Current price + D(4) chips ──
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: sensor.spot_price_predictor_price_forecast
                icon: mdi:flash
                icon_color: |-
                  {% set p = states('sensor.spot_price_predictor_price_forecast') | float(0) %}
                  {% if p < 8 %}green
                  {% elif p < 15 %}amber
                  {% else %}red{% endif %}
                content: >-
                  Now {{ states('sensor.spot_price_predictor_price_forecast') | round(1) }} c/kWh
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.spot_price_predictor_duration_forecast
                icon: mdi:chart-timeline-variant-shimmer
                icon_color: teal
                content: >-
                  D(4) {{ states('sensor.spot_price_predictor_duration_forecast') | round(1) }} c/kWh
              - type: template
                entity: sensor.spot_price_predictor_price_forecast
                icon: mdi:chart-box-outline
                icon_color: cyan
                content: >-
                  Week {{ state_attr('sensor.spot_price_predictor_price_forecast', 'week_avg_ckwh') | round(1) }}

          # ── Consumer price forecast — 48h bar chart ──
          - type: custom:apexcharts-card
            header:
              show: true
              title: Consumer Price (c/kWh)
              show_states: false
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              color: white
              label: Now
            experimental:
              color_threshold: true
            yaxis:
              - id: price
                min: 0
                decimals: 1
                apex_config:
                  tickAmount: 5
            apex_config:
              chart:
                height: 280
              plotOptions:
                bar:
                  columnWidth: 90%
              tooltip:
                x:
                  format: "ddd dd.MM HH:mm"
            series:
              - entity: sensor.spot_price_predictor_price_forecast
                name: Consumer price
                yaxis_id: price
                type: column
                float_precision: 1
                unit: " c/kWh"
                show:
                  extremas: true
                color_threshold:
                  - value: 0
                    color: "#22c55e"
                  - value: 8
                    color: "#60a5fa"
                  - value: 12
                    color: "#facc15"
                  - value: 18
                    color: "#f97316"
                  - value: 25
                    color: "#ef4444"
                data_generator: |
                  const fc = entity.attributes.forecast;
                  if (!fc) return [];
                  return fc.map((e) => [new Date(e.timestamp).getTime(), e.consumer_ckwh]);

          # ── 7-day consumer price trend ──
          - type: custom:apexcharts-card
            header:
              show: true
              title: 7-Day Hourly Price (c/kWh)
              show_states: false
            graph_span: 7d
            span:
              start: hour
            now:
              show: true
              color: white
              label: Now
            yaxis:
              - id: price
                min: 0
                decimals: 1
                apex_config:
                  tickAmount: 5
            apex_config:
              chart:
                height: 220
              stroke:
                width: 2
                curve: smooth
              tooltip:
                x:
                  format: "ddd dd.MM HH:mm"
            series:
              - entity: sensor.spot_price_predictor_price_forecast
                name: Consumer price
                yaxis_id: price
                type: area
                float_precision: 1
                unit: " c/kWh"
                color: "#60a5fa"
                opacity: 0.15
                data_generator: |
                  const fc = entity.attributes.forecast;
                  if (!fc) return [];
                  return fc.map((e) => [new Date(e.timestamp).getTime(), e.consumer_ckwh]);

      # ── Right column: D(k) duration curves + info ──
      - title: ""
        cards:

          # ── Today's D(k) summary ──
          - type: custom:mushroom-template-card
            entity: sensor.spot_price_predictor_duration_forecast
            icon: mdi:chart-timeline-variant-shimmer
            icon_color: |-
              {% set p = states('sensor.spot_price_predictor_duration_forecast') | float(0) %}
              {% if p < 8 %}green
              {% elif p < 15 %}amber
              {% else %}red{% endif %}
            primary: >-
              D(4) {{ states('sensor.spot_price_predictor_duration_forecast') | round(1) }} c/kWh
            secondary: >-
              {% set dk = state_attr('sensor.spot_price_predictor_duration_forecast', 'daily_forecast') %}
              {% if dk and dk | length > 0 %}
              D(1) {{ dk[0].dk_consumer_cent_kwh[0] | round(1) }}
              · D(8) {{ dk[0].dk_consumer_cent_kwh[7] | round(1) }}
              · D(24) {{ dk[0].dk_consumer_cent_kwh[23] | round(1) }} c/kWh
              {% endif %}
            layout: horizontal
            tap_action:
              action: more-info

          # ── 7-Day D(k) forecast — multi-line chart ──
          # D(k) = average consumer price for cheapest k hours per day
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Daily Cost by Usage Duration (c/kWh)"
              show_states: false
            graph_span: 7d
            span:
              start: day
            yaxis:
              - id: dk
                min: ~0
                decimals: 1
                apex_config:
                  tickAmount: 5
            apex_config:
              chart:
                height: 300
              stroke:
                width: 3
                curve: smooth
              legend:
                show: true
                position: top
              markers:
                size: 4
              tooltip:
                shared: true
                x:
                  format: "ddd dd.MM"
            series:
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "D(1)"
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#22d3ee"
                data_generator: |
                  const dk = entity.attributes.daily_forecast;
                  if (!dk) return [];
                  return dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(), d.dk_consumer_cent_kwh[0]]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "D(4)"
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#facc15"
                data_generator: |
                  const dk = entity.attributes.daily_forecast;
                  if (!dk) return [];
                  return dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(), d.dk_consumer_cent_kwh[3]]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "D(8)"
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#f97316"
                data_generator: |
                  const dk = entity.attributes.daily_forecast;
                  if (!dk) return [];
                  return dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(), d.dk_consumer_cent_kwh[7]]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "D(24)"
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#ef4444"
                data_generator: |
                  const dk = entity.attributes.daily_forecast;
                  if (!dk) return [];
                  return dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(), d.dk_consumer_cent_kwh[23]]);

          # ── Week price range ──
          - type: custom:mushroom-template-card
            entity: sensor.spot_price_predictor_price_forecast
            icon: mdi:calendar-week
            icon_color: cyan
            primary: "Week forecast"
            secondary: >-
              Min {{ state_attr('sensor.spot_price_predictor_price_forecast', 'week_min_ckwh') | round(1) }}
              · Avg {{ state_attr('sensor.spot_price_predictor_price_forecast', 'week_avg_ckwh') | round(1) }}
              · Max {{ state_attr('sensor.spot_price_predictor_price_forecast', 'week_max_ckwh') | round(1) }} c/kWh
            layout: horizontal
            tap_action:
              action: more-info

          # ── Current consumer price ──
          - type: custom:mushroom-template-card
            entity: sensor.spot_price_predictor_price_forecast
            icon: mdi:flash
            icon_color: |-
              {% set p = states('sensor.spot_price_predictor_price_forecast') | float(0) %}
              {% if p < 8 %}green
              {% elif p < 15 %}amber
              {% else %}red{% endif %}
            primary: >-
              {{ states('sensor.spot_price_predictor_price_forecast') | round(2) }} c/kWh
            secondary: >-
              Spot {{ state_attr('sensor.spot_price_predictor_price_forecast', 'current_spot_eur_mwh') | round(1) }} EUR/MWh
              · {{ state_attr('sensor.spot_price_predictor_price_forecast', 'operator') }}
            layout: horizontal
            tap_action:
              action: more-info

          # ── Data status ──
          - type: custom:mushroom-template-card
            entity: sensor.spot_price_predictor_price_forecast
            icon: mdi:information-outline
            icon_color: |-
              {% if state_attr('sensor.spot_price_predictor_price_forecast', 'stale') %}
                red
              {% else %}
                green
              {% endif %}
            primary: "Forecast status"
            secondary: >-
              {{ state_attr('sensor.spot_price_predictor_price_forecast', 'data_sources_active') }}
              · {{ state_attr('sensor.spot_price_predictor_price_forecast', 'forecast_hours') }}h
              · {{ state_attr('sensor.spot_price_predictor_duration_forecast', 'forecast_days') }}d D(k)
              {% if state_attr('sensor.spot_price_predictor_price_forecast', 'stale') %}
                · Stale ({{ state_attr('sensor.spot_price_predictor_price_forecast', 'data_age_minutes') }} min)
              {% endif %}
            layout: horizontal
            tap_action:
              action: more-info
