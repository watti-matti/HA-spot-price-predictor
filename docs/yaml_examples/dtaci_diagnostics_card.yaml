# ============================================================
# DtACI Diagnostics Card — adaptive D(k) calibration monitor
# ============================================================
#
# Renders the parameter set from `dtaci_info_cards.html` directly
# from `sensor.spot_price_predictor_duration_forecast`'s diagnostic
# attributes. Requires the integration's `enable_dtaci_dk` toggle
# to be on.
#
# Required HACS frontend cards:
#   * apexcharts-card  (per-k coverage / width plots)
#   * markdown card    (KPI tiles + descriptions; built into HA)
#
# Sensor attributes consumed (all under
# `state_attr('sensor.spot_price_predictor_duration_forecast', '<key>')`):
#
#   dtaci_diagnostics          full per-zone dict, indexed [zones][<zone>]
#   dtaci_target_coverage      0.9
#   dtaci_fi_mean_coverage     mean over 48 instances on the FI bundle
#   dtaci_fi_mean_width_eur_kwh
#   dtaci_fi_warm_instances    n_updates >= min_warmup
#   dtaci_fi_total_instances   48   (24 cheap + 24 peak — schema since v2.5.1)
#
# Per-zone breakdown lives at
#   dtaci_diagnostics.zones.<zone>.per_k.<direction>.<k>.<param>
# where direction ∈ {cheap, peak}, k ∈ 1..24, param ∈
#   coverage, alpha_agg, bias_ema, dominant_gamma,
#   weight_entropy_bits, half_width, n_updates, bias_warm
# ============================================================

title: DtACI Calibration
type: vertical-stack
cards:

  # ── Header / KPI tiles ───────────────────────────────────────
  - type: markdown
    content: |
      ## DtACI Online Calibration  ·  FI bundle
      Adaptive conformal inference applied per D(i) order statistic. Updated daily.

      |  |  |  |  |
      |---|---|---|---|
      | **Target** | **{{ (state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_target_coverage") * 100) | round(0) }} %** | **Realized** | **{{ (state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_mean_coverage") * 100) | round(1) }} %** |
      | **Mean width** | **{{ (state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_mean_width_eur_kwh") * 100) | round(2) }} c/kWh** | **Warm** | **{{ state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_warm_instances") }} / {{ state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_total_instances") }}** |

  # ── Per-k coverage bars (cheap end) ──────────────────────────
  - type: custom:apexcharts-card
    header:
      show: true
      title: "Per-k coverage — D_cheap (target 90 %)"
    apex_config:
      chart:
        height: 420px
        type: bar
      plotOptions:
        bar:
          horizontal: true
          dataLabels:
            position: "center"
      dataLabels:
        enabled: true
        formatter: |
          EVAL: function (val) { return (val * 100).toFixed(1) + ' %'; }
      xaxis:
        min: 0.7
        max: 1.0
      yaxis:
        labels:
          show: true
      tooltip:
        y:
          formatter: |
            EVAL: function (val) { return (val * 100).toFixed(2) + ' %'; }
    series:
      - entity: sensor.spot_price_predictor_duration_forecast
        name: coverage
        type: column
        color_threshold:
          - value: 0.0
            color: "#A32D2D"
          - value: 0.85
            color: "#EF9F27"
          - value: 0.88
            color: "#1D9E75"
        data_generator: |
          const diag = entity.attributes.dtaci_diagnostics;
          if (!diag || !diag.zones || !diag.zones.fi) return [];
          const cheap = diag.zones.fi.per_k.cheap;
          return Array.from({length: 24}, (_, i) => i + 1).map(k => ({
            x: 'k=' + k,
            y: cheap[k] ? cheap[k].coverage : null
          }));

  # ── Per-k coverage bars (peak end) ───────────────────────────
  - type: custom:apexcharts-card
    header:
      show: true
      title: "Per-k coverage — D_peak (target 90 %)"
    apex_config:
      chart:
        height: 420px
        type: bar
      plotOptions:
        bar:
          horizontal: true
          dataLabels:
            position: "center"
      dataLabels:
        enabled: true
        formatter: |
          EVAL: function (val) { return (val * 100).toFixed(1) + ' %'; }
      xaxis:
        min: 0.7
        max: 1.0
      yaxis:
        labels:
          show: true
    series:
      - entity: sensor.spot_price_predictor_duration_forecast
        name: coverage
        type: column
        color_threshold:
          - value: 0.0
            color: "#A32D2D"
          - value: 0.85
            color: "#EF9F27"
          - value: 0.88
            color: "#1D9E75"
        data_generator: |
          const diag = entity.attributes.dtaci_diagnostics;
          if (!diag || !diag.zones || !diag.zones.fi) return [];
          const peak = diag.zones.fi.per_k.peak;
          return Array.from({length: 24}, (_, i) => i + 1).map(k => ({
            x: 'k=' + k,
            y: peak[k] ? peak[k].coverage : null
          }));

  # ── Per-k bias EMA (cheap + peak) ────────────────────────────
  - type: custom:apexcharts-card
    header:
      show: true
      title: "Per-k bias EMA  (consumer c/kWh)"
    apex_config:
      chart:
        height: 420px
        type: bar
      plotOptions:
        bar:
          dataLabels:
            position: "top"
      dataLabels:
        enabled: false
      stroke:
        show: true
        width: 1
      xaxis:
        type: category
      yaxis:
        decimalsInFloat: 2
    series:
      - entity: sensor.spot_price_predictor_duration_forecast
        name: D_cheap
        type: column
        color: "#0EA5E9"
        data_generator: |
          const diag = entity.attributes.dtaci_diagnostics;
          if (!diag || !diag.zones || !diag.zones.fi) return [];
          const cheap = diag.zones.fi.per_k.cheap;
          return Array.from({length: 24}, (_, i) => i + 1).map(k => ({
            x: 'k=' + k,
            y: cheap[k] ? cheap[k].bias_ema * 100 : null    // EUR/kWh -> c/kWh
          }));
      - entity: sensor.spot_price_predictor_duration_forecast
        name: D_peak
        type: column
        color: "#EF4444"
        data_generator: |
          const diag = entity.attributes.dtaci_diagnostics;
          if (!diag || !diag.zones || !diag.zones.fi) return [];
          const peak = diag.zones.fi.per_k.peak;
          return Array.from({length: 24}, (_, i) => i + 1).map(k => ({
            x: 'k=' + k,
            y: peak[k] ? peak[k].bias_ema * 100 : null
          }));

  # ── Dominant γ + weight entropy spotlight: D_peak(1) ─────────
  # The single priciest hour is the most operationally important
  # statistic — surface its diagnostics prominently. Edit `peak`/`1`
  # below to spotlight a different (direction, k).
  - type: markdown
    content: |
      ### Spotlight  ·  D_peak(1)  (single priciest hour)
      {% set d = state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_diagnostics") %}
      {% if d and d.zones and d.zones.fi and d.zones.fi.per_k.peak[1] %}
      {% set s = d.zones.fi.per_k.peak[1] %}
      |  |  |
      |---|---|
      | n_updates | **{{ s.n_updates }}** |
      | bias_warm | {{ "✅ warm" if s.bias_warm else "🟡 cold" }} |
      | coverage  | **{{ (s.coverage * 100) | round(1) }} %** |
      | alpha_agg | {{ s.alpha_agg | round(3) }}  (target 0.10) |
      | bias_ema  | **{{ (s.bias_ema * 100) | round(2) }} c/kWh** |
      | dominant γ | `{{ s.dominant_gamma }}` |
      | weight entropy | {{ s.weight_entropy_bits | round(2) }} bits |
      | interval half-width | **{{ (s.half_width * 100) | round(2) }} c/kWh** |
      {% else %}
      Awaiting first reconciliation cycle. Each forecast/actual day-pair
      adds one update; full warm-up takes ~14 days.
      {% endif %}

  # ── Neighbour zones (research diagnostic, not consumer-facing) ──
  - type: markdown
    content: |
      ### Neighbour zones  ·  bias diagnostics

      The Phase B v2 architecture keeps SE1 / SE3 / EE bundles for
      monitoring market-wide disturbance signals. Updates wired in a
      follow-up cycle (currently neighbour bundles allocated but not
      yet reconciled).

      {% set d = state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_diagnostics") %}
      {% if d and d.zones %}
      | Zone | Warm/Total | Mean coverage | Mean width |
      |---|---:|---:|---:|
      {% for zone in ['fi', 'se1', 'se3', 'ee'] -%}
      {% set z = d.zones.get(zone) %}
      {% if z -%}
      | {{ zone | upper }} | {{ z.n_warm_instances }} / {{ z.n_total_instances }} | {{ (z.mean_coverage * 100) | round(1) }} % | {{ z.mean_width | round(3) }} |
      {% endif -%}
      {%- endfor %}
      {% else %}
      _DtACI not yet enabled or coordinator hasn't completed first cycle._
      {% endif %}

  # ── Reference / threshold table ─────────────────────────────
  - type: markdown
    content: |
      ### Threshold reference

      | Parameter | OK | Warning | Critical | Source |
      |---|---|---|---|---|
      | Coverage | ≥ 87 % | 85–87 % | < 85 % > 7 d | G&C 2024 |
      | \|bias_ema\| | < 1 c/kWh | 1–3 c/kWh | > 3 c/kWh | Uniejewski 2016 |
      | \|alpha_agg − α\| | < 0.02 | 0.02–0.05 | > 0.05 persist. | G&C 2024 |
      | Dominant γ | < 0.003 | 0.02–0.05 | > 0.05 / 10× jump | G&C 2024 §4 |
      | Width ratio | 0.5–2× base | — | > 2× / < 0.5× | G&R 2007 |
      | Weight entropy | < 1.5 bits | 1.5–3 bits | > 3 bits (max ≈ 3.91 for M=15) | CBL 2006 |

      Citations: Gibbs & Candès JMLR 25 (2024) · Uniejewski et al.
      Energy Economics 2016 · Gneiting & Raftery JASA 2007 ·
      Cesa-Bianchi & Lugosi 2006.
