# ============================================================
# DtACI Diagnostics Dashboard — adaptive D(k) calibration monitor
# ============================================================
#
# How to use this file — two paste paths:
#
#   A. AS A COMPLETE DASHBOARD (recommended — copy entire file):
#      Settings → Dashboards → + Add Dashboard → "New dashboard from scratch" →
#      open the new dashboard → ⋮ (top right) → Edit Dashboard →
#      ⋮ → Raw configuration editor → REPLACE the entire content with this file →
#      Save.
#
#   B. AS A CARD IN AN EXISTING DASHBOARD:
#      In an existing dashboard's Edit mode, click "Add Card" → Manual.
#      Paste ONLY the `vertical-stack` block (the inner card starting from
#      `type: vertical-stack` under `views[0].cards[0]`, including its
#      child `cards:` list). Do NOT paste the outer `title:` / `views:` keys —
#      those are the dashboard wrapper.
#
# ============================================================
#
# Renders DtACI diagnostics directly from
# `sensor.spot_price_predictor_duration_forecast`'s diagnostic attributes.
# Requires the integration's `enable_dtaci_dk` toggle to be on.
#
# Required HACS frontend cards:
#   * apexcharts-card  (per-k coverage / width plots)
#   * markdown card    (KPI tiles + descriptions; built into HA)
#
# Sensor attributes consumed (all under
# `state_attr('sensor.spot_price_predictor_duration_forecast', '<key>')`):
#
#   dtaci_diagnostics          full per-zone dict, indexed [zones][<zone>]
#   dtaci_target_coverage      0.9
#   dtaci_fi_mean_coverage     mean over 48 instances on the FI bundle
#   dtaci_fi_mean_width_eur_kwh
#   dtaci_fi_warm_instances    n_updates >= min_warmup
#   dtaci_fi_total_instances   48   (24 cheap + 24 peak — schema since v2.5.1)
#
# Per-zone breakdown lives at
#   dtaci_diagnostics.zones.<zone>.per_k.<direction>.<k>.<param>
# where direction ∈ {cheap, peak}, k ∈ 1..24, param ∈
#   coverage, alpha_agg, bias_ema, dominant_gamma,
#   weight_entropy_bits, half_width, n_updates, bias_warm
# ============================================================

title: DtACI Calibration
views:
  - title: DtACI
    path: dtaci
    icon: mdi:gauge
    cards:
      - type: vertical-stack
        cards:

          # ── Header / KPI tiles ───────────────────────────────────────
          # HTML tables embedded in the markdown card give explicit
          # column-width control via <colgroup> and survive HA's
          # dashboard editor's YAML scalar reformatting (browser ignores
          # whitespace between tags, so >|>|> all render identically).
          - type: markdown
            content: |
              ## DtACI Online Calibration  ·  FI bundle
              Adaptive conformal inference applied per D(i) order statistic. Updated daily.

              <table style="width:100%; border-collapse:collapse; margin-top:8px;">
              <colgroup><col style="width:20%"><col style="width:30%"><col style="width:20%"><col style="width:30%"></colgroup>
              <tbody>
              <tr><td style="padding:6px;"><b>Target</b></td><td style="padding:6px; text-align:right;"><b>{{ (state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_target_coverage") * 100) | round(0) }} %</b></td><td style="padding:6px;"><b>Realized</b></td><td style="padding:6px; text-align:right;"><b>{{ (state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_mean_coverage") * 100) | round(1) }} %</b></td></tr>
              <tr><td style="padding:6px;"><b>Mean width</b></td><td style="padding:6px; text-align:right;"><b>{{ (state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_mean_width_eur_kwh") * 100) | round(2) }} c/kWh</b></td><td style="padding:6px;"><b>Warm</b></td><td style="padding:6px; text-align:right;"><b>{{ state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_warm_instances") }} / {{ state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_fi_total_instances") }}</b></td></tr>
              </tbody>
              </table>

          # ── Per-k coverage bars (cheap end) ──────────────────────────
          # Coverage is the fraction of recent days where the realised
          # D(k) statistic fell inside the published interval. Target = 0.90.
          # Bars stack vertically over k=1..24; y-axis scaled 70%..100%.
          # Multiplied by 100 in the data generator so the y-axis reads
          # as a percentage directly (avoids axis-format formatter issues).
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Per-k coverage — D_cheap (target 90 %)"
            apex_config:
              chart:
                height: 320px
                type: bar
              plotOptions:
                bar:
                  horizontal: false
                  columnWidth: "80%"
                  dataLabels:
                    position: "top"
              dataLabels:
                enabled: false
              xaxis:
                type: category
                title:
                  text: k
              yaxis:
                min: 70
                max: 100
                decimalsInFloat: 1
                title:
                  text: coverage %
              tooltip:
                y:
                  formatter: |
                    EVAL: function (val) { return val.toFixed(2) + ' %'; }
              annotations:
                yaxis:
                  - y: 90
                    borderColor: "#16a34a"
                    strokeDashArray: 4
                    label:
                      text: "target 90 %"
                      borderColor: "#16a34a"
                      style:
                        color: "#16a34a"
                        background: "rgba(255,255,255,0.85)"
            series:
              - entity: sensor.spot_price_predictor_duration_forecast
                name: coverage
                type: column
                color_threshold:
                  - value: 0
                    color: "#A32D2D"
                  - value: 85
                    color: "#EF9F27"
                  - value: 88
                    color: "#1D9E75"
                data_generator: |
                  const diag = entity.attributes.dtaci_diagnostics;
                  if (!diag || !diag.zones || !diag.zones.fi) return [];
                  const cheap = diag.zones.fi.per_k.cheap;
                  return Array.from({length: 24}, (_, i) => i + 1)
                    .map(k => ({
                      x: String(k),
                      y: cheap && cheap[k] && cheap[k].coverage != null
                          ? cheap[k].coverage * 100
                          : null,
                    }));

          # ── Per-k coverage bars (peak end) ───────────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Per-k coverage — D_peak (target 90 %)"
            apex_config:
              chart:
                height: 320px
                type: bar
              plotOptions:
                bar:
                  horizontal: false
                  columnWidth: "80%"
                  dataLabels:
                    position: "top"
              dataLabels:
                enabled: false
              xaxis:
                type: category
                title:
                  text: k
              yaxis:
                min: 70
                max: 100
                decimalsInFloat: 1
                title:
                  text: coverage %
              tooltip:
                y:
                  formatter: |
                    EVAL: function (val) { return val.toFixed(2) + ' %'; }
              annotations:
                yaxis:
                  - y: 90
                    borderColor: "#16a34a"
                    strokeDashArray: 4
                    label:
                      text: "target 90 %"
                      borderColor: "#16a34a"
                      style:
                        color: "#16a34a"
                        background: "rgba(255,255,255,0.85)"
            series:
              - entity: sensor.spot_price_predictor_duration_forecast
                name: coverage
                type: column
                color_threshold:
                  - value: 0
                    color: "#A32D2D"
                  - value: 85
                    color: "#EF9F27"
                  - value: 88
                    color: "#1D9E75"
                data_generator: |
                  const diag = entity.attributes.dtaci_diagnostics;
                  if (!diag || !diag.zones || !diag.zones.fi) return [];
                  const peak = diag.zones.fi.per_k.peak;
                  return Array.from({length: 24}, (_, i) => i + 1)
                    .map(k => ({
                      x: String(k),
                      y: peak && peak[k] && peak[k].coverage != null
                          ? peak[k].coverage * 100
                          : null,
                    }));

          # ── Per-k bias EMA (cheap + peak) ────────────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Per-k bias EMA  (consumer c/kWh)"
            apex_config:
              chart:
                height: 420px
                type: bar
              plotOptions:
                bar:
                  dataLabels:
                    position: "top"
              dataLabels:
                enabled: false
              stroke:
                show: true
                width: 1
              xaxis:
                type: category
              yaxis:
                decimalsInFloat: 2
            series:
              - entity: sensor.spot_price_predictor_duration_forecast
                name: D_cheap
                type: column
                color: "#0EA5E9"
                data_generator: |
                  const diag = entity.attributes.dtaci_diagnostics;
                  if (!diag || !diag.zones || !diag.zones.fi) return [];
                  const cheap = diag.zones.fi.per_k.cheap;
                  return Array.from({length: 24}, (_, i) => i + 1).map(k => ({
                    x: 'k=' + k,
                    y: cheap[k] ? cheap[k].bias_ema * 100 : null
                  }));
              - entity: sensor.spot_price_predictor_duration_forecast
                name: D_peak
                type: column
                color: "#EF4444"
                data_generator: |
                  const diag = entity.attributes.dtaci_diagnostics;
                  if (!diag || !diag.zones || !diag.zones.fi) return [];
                  const peak = diag.zones.fi.per_k.peak;
                  return Array.from({length: 24}, (_, i) => i + 1).map(k => ({
                    x: 'k=' + k,
                    y: peak[k] ? peak[k].bias_ema * 100 : null
                  }));

          # ── Dominant γ + weight entropy spotlight: D_peak(1) ─────────
          - type: markdown
            content: |
              ### Spotlight  ·  D_peak(1)  (single priciest hour)
              {% set d = state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_diagnostics") %}
              {% if d and d.zones and d.zones.fi and d.zones.fi.per_k.peak[1] %}
              {% set s = d.zones.fi.per_k.peak[1] %}
              <table style="width:100%; max-width:520px; border-collapse:collapse; margin-top:8px;">
              <colgroup><col style="width:50%"><col style="width:50%"></colgroup>
              <tbody>
              <tr><td style="padding:5px 8px;">n_updates</td><td style="padding:5px 8px; text-align:right;"><b>{{ s.n_updates }}</b></td></tr>
              <tr><td style="padding:5px 8px;">bias_warm</td><td style="padding:5px 8px; text-align:right;">{{ "✅ warm" if s.bias_warm else "🟡 cold" }}</td></tr>
              <tr><td style="padding:5px 8px;">coverage</td><td style="padding:5px 8px; text-align:right;"><b>{{ (s.coverage * 100) | round(1) }} %</b></td></tr>
              <tr><td style="padding:5px 8px;">alpha_agg</td><td style="padding:5px 8px; text-align:right;">{{ s.alpha_agg | round(3) }} <small>(target 0.10)</small></td></tr>
              <tr><td style="padding:5px 8px;">bias_ema</td><td style="padding:5px 8px; text-align:right;"><b>{{ (s.bias_ema * 100) | round(2) }} c/kWh</b></td></tr>
              <tr><td style="padding:5px 8px;">dominant γ</td><td style="padding:5px 8px; text-align:right;"><code>{{ s.dominant_gamma }}</code></td></tr>
              <tr><td style="padding:5px 8px;">weight entropy</td><td style="padding:5px 8px; text-align:right;">{{ s.weight_entropy_bits | round(2) }} bits</td></tr>
              <tr><td style="padding:5px 8px;">interval half-width</td><td style="padding:5px 8px; text-align:right;"><b>{{ (s.half_width * 100) | round(2) }} c/kWh</b></td></tr>
              </tbody>
              </table>
              {% else %}
              Awaiting first reconciliation cycle. Each forecast/actual day-pair adds one update; full warm-up takes ~14 days.
              {% endif %}

          # ── Neighbour zones (research diagnostic) ────────────────────
          - type: markdown
            content: |
              ### Neighbour zones  ·  bias diagnostics
              {% set d = state_attr("sensor.spot_price_predictor_duration_forecast", "dtaci_diagnostics") %}
              {% if d and d.zones %}
              <table style="width:100%; border-collapse:collapse; margin-top:8px;">
              <colgroup><col style="width:18%"><col style="width:22%"><col style="width:30%"><col style="width:30%"></colgroup>
              <thead><tr style="background:#374151; color:#fff;">
              <th style="padding:6px; text-align:left;">Zone</th>
              <th style="padding:6px; text-align:right;">Warm / Total</th>
              <th style="padding:6px; text-align:right;">Mean coverage</th>
              <th style="padding:6px; text-align:right;">Mean width</th>
              </tr></thead>
              <tbody>
              {% for zone in ['fi', 'se1', 'se3', 'ee'] %}{% set z = d.zones.get(zone) %}{% if z %}<tr><td style="padding:5px 8px;"><b>{{ zone | upper }}</b></td><td style="padding:5px 8px; text-align:right;">{{ z.n_warm_instances }} / {{ z.n_total_instances }}</td><td style="padding:5px 8px; text-align:right;">{{ (z.mean_coverage * 100) | round(1) }} %</td><td style="padding:5px 8px; text-align:right;">{{ z.mean_width | round(3) }}</td></tr>{% endif %}{% endfor %}
              </tbody>
              </table>
              {% else %}
              _DtACI not yet enabled or coordinator hasn't completed first cycle._
              {% endif %}

          # ── Reference / threshold table ──────────────────────────────
          - type: markdown
            content: |
              ### Threshold reference
              <table style="width:100%; border-collapse:collapse; margin-top:8px; font-size:0.92em;">
              <colgroup><col style="width:20%"><col style="width:16%"><col style="width:18%"><col style="width:28%"><col style="width:18%"></colgroup>
              <thead><tr style="background:#374151; color:#fff;">
              <th style="padding:6px; text-align:left;">Parameter</th>
              <th style="padding:6px; text-align:center; background:#15803d;">OK</th>
              <th style="padding:6px; text-align:center; background:#a16207;">Warning</th>
              <th style="padding:6px; text-align:center; background:#b91c1c;">Critical</th>
              <th style="padding:6px; text-align:left;">Source</th>
              </tr></thead>
              <tbody>
              <tr><td style="padding:5px 8px;"><b>Coverage</b></td><td style="padding:5px 8px; text-align:center;">≥ 87 %</td><td style="padding:5px 8px; text-align:center;">85–87 %</td><td style="padding:5px 8px; text-align:center;">&lt; 85 % &gt; 7 d</td><td style="padding:5px 8px;">G&amp;C 2024</td></tr>
              <tr><td style="padding:5px 8px;"><b>|bias_ema|</b></td><td style="padding:5px 8px; text-align:center;">&lt; 1 c/kWh</td><td style="padding:5px 8px; text-align:center;">1–3 c/kWh</td><td style="padding:5px 8px; text-align:center;">&gt; 3 c/kWh</td><td style="padding:5px 8px;">Uniejewski 2016</td></tr>
              <tr><td style="padding:5px 8px;"><b>|alpha_agg − α|</b></td><td style="padding:5px 8px; text-align:center;">&lt; 0.02</td><td style="padding:5px 8px; text-align:center;">0.02–0.05</td><td style="padding:5px 8px; text-align:center;">&gt; 0.05 persist.</td><td style="padding:5px 8px;">G&amp;C 2024</td></tr>
              <tr><td style="padding:5px 8px;"><b>Dominant γ</b></td><td style="padding:5px 8px; text-align:center;">&lt; 0.003</td><td style="padding:5px 8px; text-align:center;">0.02–0.05</td><td style="padding:5px 8px; text-align:center;">&gt; 0.05 / 10× jump</td><td style="padding:5px 8px;">G&amp;C 2024 §4</td></tr>
              <tr><td style="padding:5px 8px;"><b>Width ratio</b></td><td style="padding:5px 8px; text-align:center;">0.5–2× base</td><td style="padding:5px 8px; text-align:center;">—</td><td style="padding:5px 8px; text-align:center;">&gt; 2× / &lt; 0.5×</td><td style="padding:5px 8px;">G&amp;R 2007</td></tr>
              <tr><td style="padding:5px 8px;"><b>Weight entropy</b></td><td style="padding:5px 8px; text-align:center;">&lt; 1.5 bits</td><td style="padding:5px 8px; text-align:center;">1.5–3 bits</td><td style="padding:5px 8px; text-align:center;">&gt; 3 bits (max ≈ 3.91 for M=15)</td><td style="padding:5px 8px;">CBL 2006</td></tr>
              </tbody>
              </table>

              <small>Citations: Gibbs &amp; Candès JMLR 25 (2024) · Uniejewski et al. Energy Economics 2016 · Gneiting &amp; Raftery JASA 2007 · Cesa-Bianchi &amp; Lugosi 2006.</small>
