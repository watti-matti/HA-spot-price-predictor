# ════════════════════════════════════════════════════════════════════════
# Spot Price Predictor — v2.11.0 hero dashboard
# ════════════════════════════════════════════════════════════════════════
#
# How to use this file — two paste paths:
#
#   A. AS A COMPLETE DASHBOARD (recommended — copy entire file):
#      Settings → Dashboards → + Add Dashboard → "New dashboard from scratch"
#      → open the new dashboard → ⋮ (top right) → Edit Dashboard →
#      ⋮ → Raw configuration editor → REPLACE the entire content with this
#      file → Save.
#
#   B. AS A CARD IN AN EXISTING DASHBOARD:
#      In an existing dashboard's Edit mode, click Add Card → Manual.
#      Paste ONLY the inner vertical-stack block (the card under
#      views[0].cards[0], including its child `cards:` list). Do NOT paste
#      the outer `title:` / `views:` keys — those are the dashboard wrapper.
#
# Showcases the four pieces of information the integration uniquely produces:
#
#   1. 170-hour probabilistic fan chart   — what to expect and how uncertain
#   2. D(k) cheap/peak duration curves    — the cheapest-k-hours summary
#   3. PV-aware daily risk (v2.11.0)      — downside cost from joint
#                                            price + PV uncertainty
#   4. PV-aware D(k) (when PV enabled)    — same curves, net of self-consumption
#
# Requires:
#   - custom:apexcharts-card  (HACS → Frontend)
#   - HA built-in markdown card
#
# Sensors consumed:
#   - sensor.spot_price_predictor_price_forecast       (always)
#   - sensor.spot_price_forecast_fi                    (always — Nordpool-compatible)
#   - sensor.spot_price_predictor_duration_forecast    (always)
#
# Optional sensor if Nordpool is linked:
#   - sensor.spot_price_predictor_spot_electricity_price  (realised price overlay)
#
# Adjust entity IDs in the YAML if your install uses different names.
# Cards are responsive and work on phone-width.
# ════════════════════════════════════════════════════════════════════════

title: Spot price forecast (v2.11.0)
views:
  - title: Forecast
    path: forecast
    icon: mdi:chart-line
    cards:
      - type: vertical-stack
        cards:

          # ── Status strip ───────────────────────────────────────────────
          # HTML tables here so HA's GUI editor cannot break the layout
          # by reformatting YAML scalars (browser ignores whitespace
          # between tags; column widths set explicitly via <colgroup>).
          - type: markdown
            content: |
              ## Forecast status
              <table style="width:100%; border-collapse:collapse; margin-top:8px;">
              <colgroup><col style="width:32%"><col style="width:30%"><col style="width:38%"></colgroup>
              <tbody>
              <tr><td style="padding:6px;"><b>Now</b></td><td style="padding:6px; text-align:right;"><b>{{ (states('sensor.spot_price_predictor_price_forecast') | float * 100) | round(1) }} c/kWh</b></td><td style="padding:6px;"><small>current hour, consumer EUR/kWh</small></td></tr>
              <tr><td style="padding:6px;"><b>Forecast (spot)</b></td><td style="padding:6px; text-align:right;"><b>{{ (states('sensor.spot_price_forecast_fi') | float * 100) | round(1) }} c/kWh</b></td><td style="padding:6px;"><small>current hour, EUR/kWh</small></td></tr>
              <tr><td style="padding:6px;"><b>Today min / avg / max</b></td><td style="padding:6px; text-align:right;">{{ (state_attr('sensor.spot_price_forecast_fi','today_min') * 100) | round(1) }} / {{ (state_attr('sensor.spot_price_forecast_fi','today_avg') * 100) | round(1) }} / {{ (state_attr('sensor.spot_price_forecast_fi','today_max') * 100) | round(1) }} c/kWh</td><td></td></tr>
              <tr><td style="padding:6px;"><b>Tomorrow avg</b></td><td style="padding:6px; text-align:right;">{{ (state_attr('sensor.spot_price_forecast_fi','tomorrow_avg') * 100) | round(1) }} c/kWh</td><td></td></tr>
              <tr><td style="padding:6px;"><b>Updated</b></td><td style="padding:6px; text-align:right;">{{ state_attr('sensor.spot_price_predictor_price_forecast','last_update') | as_datetime | relative_time }} ago</td><td style="padding:6px;">{% if state_attr('sensor.spot_price_predictor_price_forecast','stale') %}⚠ <b>stale</b> ({{ state_attr('sensor.spot_price_predictor_price_forecast','data_age_minutes') }} min){% else %}<span style="color:#16a34a;">fresh</span>{% endif %}</td></tr>
              </tbody>
              </table>

          # ── 1. Probabilistic fan chart (48h focus) ─────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "48-hour spot forecast — probabilistic fan chart"
              show_states: false
            graph_span: 48h
            span:
              start: hour
              offset: -1h
            now:
              show: true
              label: Now
            apex_config:
              chart:
                height: 380px
                zoom:
                  enabled: true
              stroke:
                curve: smooth
              legend:
                position: top
                horizontalAlign: left
              xaxis:
                type: datetime
              tooltip:
                x:
                  format: "ddd HH:mm"
            yaxis:
              - id: price
                opposite: false
                min: ~0
                decimals: 0
                apex_config:
                  forceNiceScale: true
                  title:
                    text: EUR/MWh
            series:
              - entity: sensor.spot_price_predictor_price_forecast
                name: P5-P95 (90% band)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "#3b82f6"
                opacity: 0.10
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P95_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P5 (lower bound)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "white"
                opacity: 1.0
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P5_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P25-P75 (50% band)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "#3b82f6"
                opacity: 0.22
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P75_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P25 (inner lower)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "white"
                opacity: 1.0
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P25_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P50 forecast
                yaxis_id: price
                type: line
                curve: smooth
                stroke_width: 3
                color: "#1d4ed8"
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P50_eur_mwh]);
              - entity: sensor.spot_price_predictor_spot_electricity_price
                name: Realised
                yaxis_id: price
                type: line
                curve: stepline
                stroke_width: 2
                color: "#111827"
                opacity: 1
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const tl = entity.attributes.timeline;
                  if (!tl) return [];
                  const hourly = {};
                  tl.forEach(t => {
                    const d = new Date(t.timestamp);
                    const hk = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()).getTime();
                    if (!hourly[hk]) hourly[hk] = [];
                    hourly[hk].push(t.price_eur_kwh * 1000);
                  });
                  return Object.entries(hourly)
                    .map(([k, v]) => [parseInt(k), v.reduce((a,b)=>a+b,0)/v.length])
                    .sort((a,b) => a[0]-b[0]);

          # ── 2. D(k) cheapest-k-hours curve (today) ─────────────────────
          # NOTE: apexcharts-card is time-series only — a category/numeric
          # k-axis does not render. We map k=1..24 onto today's 24 hours
          # (timestamps) and relabel the axis/tooltip back to "k".
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Today's cheapest-k-hours mean price"
            graph_span: 24h
            span:
              start: day
            apex_config:
              chart:
                height: 240px
                type: line
              stroke:
                curve: smooth
                width: 3
              xaxis:
                type: datetime
                title:
                  text: k (number of hours)
                labels:
                  datetimeUTC: false
                  formatter: |
                    EVAL: function (value, timestamp) {
                      var ms = (timestamp != null) ? timestamp : value;
                      return 'k' + (new Date(ms).getHours() + 1);
                    }
              tooltip:
                shared: true
                x:
                  formatter: |
                    EVAL: function (val) { return 'k = ' + (new Date(val).getHours() + 1); }
            yaxis:
              - id: price
                opposite: false
                decimals: 1
                apex_config:
                  title:
                    text: c/kWh
            series:
              - entity: sensor.spot_price_predictor_duration_forecast
                name: cheap k-h (grid)
                yaxis_id: price
                type: line
                color: "#1d4ed8"
                show:
                  legend_value: false
                  extremas: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days || !days.length) return [];
                  const t = new Date();
                  const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
                  const today = days.find(d => d.date === iso && d.dk_cheap_eur_kwh)
                             || days.find(d => d.dk_cheap_eur_kwh);
                  if (!today) return [];
                  const b = new Date(); b.setHours(0,0,0,0); const base = b.getTime();
                  return today.dk_cheap_eur_kwh.map((v, i) => [base + i*3600000, v * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: cheap k-h (PV-aware)
                yaxis_id: price
                type: line
                color: "#16a34a"
                stroke_dash: 6
                show:
                  legend_value: false
                  extremas: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days || !days.length) return [];
                  const t = new Date();
                  const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
                  const today = days.find(d => d.date === iso && d.dk_cheap_pv_eur_kwh)
                             || days.find(d => d.dk_cheap_pv_eur_kwh);
                  if (!today) return [];
                  const b = new Date(); b.setHours(0,0,0,0); const base = b.getTime();
                  return today.dk_cheap_pv_eur_kwh.map((v, i) => [base + i*3600000, v * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: peak k-h (grid)
                yaxis_id: price
                type: line
                color: "#dc2626"
                opacity: 0.6
                show:
                  legend_value: false
                  extremas: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days || !days.length) return [];
                  const t = new Date();
                  const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
                  const today = days.find(d => d.date === iso && d.dk_peak_eur_kwh)
                             || days.find(d => d.dk_peak_eur_kwh);
                  if (!today) return [];
                  const b = new Date(); b.setHours(0,0,0,0); const base = b.getTime();
                  return today.dk_peak_eur_kwh.map((v, i) => [base + i*3600000, v * 100]);

          # ── 3. PV-aware daily CVaR strip (v2.11.0) ─────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "7-day PV-aware risk forecast (CVaR₉₅)"
            graph_span: 7d
            span:
              start: day
            apex_config:
              chart:
                height: 240px
                type: bar
              plotOptions:
                bar:
                  horizontal: false
                  dataLabels:
                    position: "top"
              dataLabels:
                enabled: true
                formatter: |
                  EVAL: function (val) { return val != null ? val.toFixed(1) + ' c/kWh' : ''; }
                offsetY: -20
                style:
                  fontSize: 11px
                  colors: ["#374151"]
              tooltip:
                x:
                  format: ddd dd.MM
                y:
                  formatter: |
                    EVAL: function (val) { return val.toFixed(2) + ' c/kWh'; }
            yaxis:
              - id: cvar
                decimals: 1
                apex_config:
                  title:
                    text: CVaR₉₅ c/kWh
            series:
              - entity: sensor.spot_price_predictor_duration_forecast
                name: CVaR₉₅ (worst-5% expected cost)
                yaxis_id: cvar
                type: column
                color_threshold:
                  - value: 0
                    color: "#16a34a"
                  - value: 15
                    color: "#eab308"
                  - value: 22
                    color: "#f97316"
                  - value: 30
                    color: "#dc2626"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_cvar95_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_cvar95_eur_kwh * 100
                    ]);

          # ── 4. PV-aware diagnostics summary ────────────────────────────
          - type: markdown
            content: |
              ### PV-aware risk summary
              {% set days = state_attr('sensor.spot_price_predictor_duration_forecast', 'daily_forecast') %}
              {% if days and days[0].pv_aware_cvar95_eur_kwh is defined %}
              <table style="width:100%; border-collapse:collapse; margin-top:8px;">
              <colgroup><col style="width:28%"><col style="width:24%"><col style="width:24%"><col style="width:24%"></colgroup>
              <thead><tr style="background:#374151; color:#fff;">
              <th style="padding:6px; text-align:left;">Day</th>
              <th style="padding:6px; text-align:right;">CVaR₉₅</th>
              <th style="padding:6px; text-align:right;">Self-consumed PV</th>
              <th style="padding:6px; text-align:right;">Exported PV</th>
              </tr></thead>
              <tbody>
              {% for d in days[:7] %}<tr><td style="padding:5px 8px;"><b>{{ d.weekday }} {{ d.date[5:] }}</b></td><td style="padding:5px 8px; text-align:right;"><b>{{ (d.pv_aware_cvar95_eur_kwh * 100) | round(1) }} c/kWh</b></td><td style="padding:5px 8px; text-align:right;">{{ d.pv_aware_self_consumed_kwh | round(1) }} kWh</td><td style="padding:5px 8px; text-align:right;">{{ d.pv_aware_exported_kwh | round(1) }} kWh</td></tr>{% endfor %}
              </tbody>
              </table>

              <b>Profile source:</b> <code>{{ days[0].pv_aware_data_provenance }}</code>
              {% if days[0].pv_aware_data_provenance == 'synthetic_cold_start' %}
              <br><small><i>Using the generic Finnish-typical baseload — CVaR is a rough estimate. Configure <code>consumption_profile_entity</code> to point at an EMA module's published sensor for a household-specific value.</i></small>
              {% elif days[0].pv_aware_data_provenance == 'ema_blended' %}
              <br><small><i>EMA module is warming up (first 30 days). Numbers are improving day-by-day.</i></small>
              {% elif days[0].pv_aware_data_provenance == 'ema_warm' %}
              <br><small><i>EMA module is warm — CVaR reflects your actual household consumption pattern.</i></small>
              {% endif %}
              {% else %}
              _PV-aware CVaR appears here when <code>pv_capacity_kwp &gt; 0</code> is configured._
              {% endif %}

          # ── 5. Extended 7-day median forecast ──────────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "7-day spot forecast (median + 50% band)"
            graph_span: 7d
            span:
              start: day
            now:
              show: true
              label: Now
            apex_config:
              chart:
                height: 280px
              stroke:
                curve: smooth
              xaxis:
                type: datetime
              legend:
                position: top
                horizontalAlign: left
            yaxis:
              - id: price
                opposite: false
                decimals: 0
                apex_config:
                  title:
                    text: EUR/MWh
            series:
              - entity: sensor.spot_price_predictor_price_forecast
                name: P75
                yaxis_id: price
                type: area
                stroke_width: 0
                color: "#3b82f6"
                opacity: 0.18
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P75_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P25
                yaxis_id: price
                type: area
                stroke_width: 0
                color: "white"
                opacity: 1.0
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P25_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P50 forecast
                yaxis_id: price
                type: line
                stroke_width: 3
                color: "#1d4ed8"
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P50_eur_mwh]);
