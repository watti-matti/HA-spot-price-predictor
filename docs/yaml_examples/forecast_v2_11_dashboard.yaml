                        yaxis_id: dkprice
                        type: line
                        color: "#f59e0b"
                        show:
                          legend_value: false
                          extremas: false
                        data_generator: |
                          const days = entity.attributes.daily_forecast;
                          if (!days || !days.length) return [];
                          const has = d => d.dk_cheap_eur_kwh && d.dk_peak_eur_kwh;
                          const sel = (hass && hass.states['input_select.spp_cockpit_day']) ? hass.states['input_select.spp_cockpit_day'].state : 'Cheapest upcoming';
