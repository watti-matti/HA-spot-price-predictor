                        data_generator: |
                          return [];

                  # RIGHT — risk & PV ledger for the SELECTED day
                  - type: markdown
                    content: |
                      {%- set sel = states('input_select.spp_cockpit_day') -%}
                      {%- set days = state_attr('sensor.spot_price_predictor_duration_forecast','daily_forecast') -%}
                      {%- set ns = namespace(best=none, bm=9999) -%}
                      {%- if days -%}
                      {%- if sel in ['Cheapest upcoming','unknown','unavailable','none',''] or sel == none -%}
                      {%- for d in days -%}
                      {%- if d.source == 'forecast' and d.dk_cheap_eur_kwh and d.dk_cheap_eur_kwh[23] < ns.bm -%}
                      {%- set ns.bm = d.dk_cheap_eur_kwh[23] -%}
                      {%- set ns.best = d -%}
                      {%- endif -%}
                      {%- endfor -%}
                      {%- else -%}
                      {%- set offmap = {'Today':0,'Tomorrow':1,'In 2 days':2,'In 3 days':3,'In 4 days':4,'In 5 days':5,'In 6 days':6} -%}
                      {%- set off = offmap.get(sel, 1) -%}
                      {%- set iso = (now() + timedelta(days=off)).strftime('%Y-%m-%d') -%}
                      {%- for d in days -%}
                      {%- if d.date == iso and d.dk_cheap_eur_kwh -%}
                      {%- set ns.best = d -%}
                      {%- endif -%}
                      {%- endfor -%}
                      {%- endif -%}
                      {%- endif -%}
                      {% if ns.best %}{% set d = ns.best %}
                      ### {{ d.weekday }} {{ d.date }}{% if sel in ['Cheapest upcoming', none] %} — cheapest upcoming{% endif %}

                      {% if d.pv_aware_mean_eur_kwh is defined %}| Reading | Value |
                      |---|--:|
                      | Expected cost (PVaR mean) | {{ '%.1f'|format(d.pv_aware_mean_eur_kwh*100) }} c/kWh |
                      | Likely range (PVaR p5–p95) | {{ '%.1f'|format(d.pv_aware_p5_eur_kwh*100) }}–{{ '%.1f'|format(d.pv_aware_p95_eur_kwh*100) }} c/kWh |
                      | Worst-5% of days (PVaR CVaR₉₅) | {{ '%.1f'|format(d.pv_aware_cvar95_eur_kwh*100) }} c/kWh |
                      | Cost without solar (no-PV baseline) | {{ '%.1f'|format(d.grid_cost_eur_kwh*100) }} c/kWh |
                      | PV self-consumed, free (kWh) | {{ '%.1f'|format(d.pv_aware_self_consumed_kwh) }} |
                      | PV exported (kWh) | {{ '%.1f'|format(d.pv_aware_exported_kwh) }} |
                      {% else %}| Reading | Value |
                      |---|--:|
                      | Daily average (mean) | {{ '%.1f'|format(d.dk_cheap_eur_kwh[23]*100) }} c/kWh |
                      | Cheapest 1h | {{ '%.1f'|format(d.dk_cheap_eur_kwh[0]*100) }} c/kWh |
                      | Priciest 1h | {{ '%.1f'|format(d.dk_peak_eur_kwh[0]*100) }} c/kWh |

                      _Enable PV for the cost-risk ledger._
                      {% endif %}
                      {% else %}
                      _No duration data for **{{ sel }}** — it may be beyond the forecast horizon. Decide on nearer days._
                      {% endif %}

          # ── 3. PV-aware daily CVaR strip (v2.11.0) ─────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              # This is the PV-AWARE CVaR (pv_aware_cvar95_eur_kwh) — the
              # only CVaR the integration publishes. CVaR₉₅ = mean cost
              # across the worst 5% of scenarios (NOT a 5%-probability value,
              # which would be VaR).
              title: "PV aware CVaR₉₅ price risk (avg of the worst 5% of days)"
            graph_span: 7d
            span:
              start: day
            apex_config:
              chart:
                height: 240px
                type: bar
              grid:
                show: true
                borderColor: "rgba(120,120,120,0.25)"
                yaxis:
                  lines:
                    show: false
              annotations:
                yaxis:
                  - y: 0
                    borderColor: "#374151"
                    borderWidth: 2
                    strokeDashArray: 0
                  - y: 10
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 20
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 30
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 40
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
              plotOptions:
                bar:
                  horizontal: false
                  dataLabels:
                    position: "top"
              dataLabels:
                enabled: true
                formatter: |
                  EVAL: function (val) { return val != null ? val.toFixed(1) + ' c/kWh' : ''; }
                offsetY: -20
                style:
                  fontSize: 11px
                  colors: ["#374151"]
              tooltip:
                x:
                  format: ddd dd.MM
                y:
                  formatter: |
                    EVAL: function (val) { return val.toFixed(2) + ' c/kWh'; }
            yaxis:
              - id: cvar
                decimals: 1
                apex_config:
                  # Always include 0 (Math.min(min,0)) so the baseline shows
                  # even when all bars are positive; snap to 10 c steps.
                  forceNiceScale: true
                  min: |
                    EVAL: function (min) { return Math.floor(Math.min(min, 0) / 10) * 10; }
                  max: |
                    EVAL: function (max) { return Math.ceil(max / 10) * 10; }
                  labels:
                    formatter: |
                      EVAL: function (val) { return val.toFixed(0); }
                  title:
                    text: c/kWh
            series:
              # Grouped bars per day: expected (mean) vs worst-5% (CVaR₉₅).
              # The gap = the PV-production downside risk.
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "Expected cost (PVaR mean)"
                yaxis_id: cvar
                type: column
                color: "#16a34a"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_mean_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_mean_eur_kwh * 100
                    ]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "Worst-5% of days (PVaR CVaR₉₅)"
                yaxis_id: cvar
                type: column
                color: "#f97316"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_cvar95_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_cvar95_eur_kwh * 100
                    ]);

          # ── 3a-risk. CVaR widget: expected · 90% band · worst-5% ───────
          # The full PV-aware risk (PVaR) picture for the week in ONE
          # consistent geometry — every series is a LINE (no bars), so the
          # whole family reads as a single fan, top line down:
          #   • Worst-5% of days   (PVaR CVaR₉₅)   — orange, the tail to plan against
          #   • High estimate      (PVaR p95)      — thin blue, upper of 90% band
          #   • Expected cost      (PVaR mean)     — thick green, the middle
          #   • Low estimate       (PVaR p5)       — thin blue, lower of 90% band
          #   • Cost without solar (no-PV baseline)— grey dashed reference
          # Series labels use "plain meaning (PVaR indicator)" so purpose is
          # readable without knowing the maths. All series in c/kWh.
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Daily electricity cost with solar — read top line down (PVaR)"
            graph_span: 7d
            span:
              start: day
            apex_config:
              chart:
                height: 280px
                type: line
              grid:
                show: true
                borderColor: "rgba(120,120,120,0.25)"
              # Only the no-PV baseline is dashed (a reference); the PVaR
              # family is solid so it reads as one fan, not mixed shapes.
              stroke:
                width: [1.5, 1.5, 1.5, 2.5, 3]
                dashArray: [4, 4, 3, 0, 0]
                curve: straight
              markers:
                size: [0, 0, 0, 3, 4]
              annotations:
                yaxis:
                  - y: 0
                    borderColor: "#374151"
                    borderWidth: 2
              tooltip:
                x:
                  format: ddd dd.MM
                "y":
                  formatter: |
                    EVAL: function (val) { return val != null ? val.toFixed(2) + ' c/kWh' : ''; }
            yaxis:
              - id: risk
                decimals: 1
                apex_config:
                  forceNiceScale: true
                  min: |
                    EVAL: function (min) { return Math.floor(Math.min(min, 0) / 10) * 10; }
                  max: |
                    EVAL: function (max) { return Math.ceil(max / 10) * 10; }
                  labels:
                    formatter: |
                      EVAL: function (val) { return val.toFixed(0); }
                  title:
                    text: c/kWh
            series:
              # Band edges first (thin blue) so the bolder lines draw on top.
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "Low estimate (PVaR p5)"
                yaxis_id: risk
                type: line
                color: "#60a5fa"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_p5_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_p5_eur_kwh * 100
                    ]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "High estimate (PVaR p95)"
                yaxis_id: risk
                type: line
                color: "#60a5fa"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_p95_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_p95_eur_kwh * 100
                    ]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "Cost without solar (no-PV baseline)"
                yaxis_id: risk
                type: line
                color: "#9ca3af"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.grid_cost_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.grid_cost_eur_kwh * 100
                    ]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "Worst-5% of days (PVaR CVaR₉₅)"
                yaxis_id: risk
                type: line
                color: "#f97316"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_cvar95_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_cvar95_eur_kwh * 100
                    ]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: "Expected cost (PVaR mean)"
                yaxis_id: risk
                type: line
                color: "#16a34a"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_mean_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_mean_eur_kwh * 100
                    ]);

          # ── 3b. PV cost reduction: with vs without PV ──────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Daily cost — with vs without PV (c/kWh)"
            graph_span: 7d
            span:
              start: day
            apex_config:
              chart:
                height: 240px
                type: bar
              grid:
                show: true
                borderColor: "rgba(120,120,120,0.25)"
                yaxis:
                  lines:
                    show: false
              annotations:
                yaxis:
                  - y: 0
                    borderColor: "#374151"
                    borderWidth: 2
                    strokeDashArray: 0
                  - y: 10
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 20
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 30
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 40
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
              tooltip:
                x:
                  format: ddd dd.MM
                y:
                  formatter: |
                    EVAL: function (val) { return val.toFixed(2) + ' c/kWh'; }
            yaxis:
              - id: cost
                decimals: 1
                apex_config:
                  forceNiceScale: true
                  min: |
                    EVAL: function (min) { return Math.floor(Math.min(min, 0) / 10) * 10; }
                  max: |
                    EVAL: function (max) { return Math.ceil(max / 10) * 10; }
                  labels:
                    formatter: |
                      EVAL: function (val) { return val.toFixed(0); }
                  title:
                    text: c/kWh
            series:
              # No-PV grid baseline vs PV-aware expected cost. The gap = the
              # expected saving PV delivers that day.
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Without PV (grid)
                yaxis_id: cost
                type: column
                color: "#9ca3af"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.grid_cost_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.grid_cost_eur_kwh * 100
                    ]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: With PV (expected)
                yaxis_id: cost
                type: column
                color: "#16a34a"
                show:
                  legend_value: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days) return [];
                  return days
                    .filter(d => d.pv_aware_mean_eur_kwh != null)
                    .map(d => [
                      new Date(d.date + 'T12:00:00').getTime(),
                      d.pv_aware_mean_eur_kwh * 100
                    ]);

          # ── 4. PV-aware diagnostics summary ────────────────────────────
          - type: markdown
            content: |
              ### PV-aware risk summary
              {% set days = state_attr('sensor.spot_price_predictor_duration_forecast', 'daily_forecast') %}
              {% if days and days[0].pv_aware_cvar95_eur_kwh is defined %}
              <table style="width:100%; border-collapse:collapse; margin-top:8px;">
              <colgroup><col style="width:28%"><col style="width:24%"><col style="width:24%"><col style="width:24%"></colgroup>
              <thead><tr style="background:#374151; color:#fff;">
              <th style="padding:6px; text-align:left;">Day</th>
              <th style="padding:6px; text-align:right;">CVaR₉₅</th>
              <th style="padding:6px; text-align:right;">Self-consumed PV</th>
              <th style="padding:6px; text-align:right;">Exported PV</th>
              </tr></thead>
              <tbody>
              {% for d in days[:7] %}<tr><td style="padding:5px 8px;"><b>{{ d.weekday }} {{ d.date[5:] }}</b></td><td style="padding:5px 8px; text-align:right;"><b>{{ (d.pv_aware_cvar95_eur_kwh * 100) | round(1) }} c/kWh</b></td><td style="padding:5px 8px; text-align:right;">{{ d.pv_aware_self_consumed_kwh | round(1) }} kWh</td><td style="padding:5px 8px; text-align:right;">{{ d.pv_aware_exported_kwh | round(1) }} kWh</td></tr>{% endfor %}
              </tbody>
              </table>

              <b>Profile source:</b> <code>{{ days[0].pv_aware_data_provenance }}</code>
              {% if days[0].pv_aware_data_provenance == 'synthetic_cold_start' %}
              <br><small><i>Using the generic Finnish-typical baseload — CVaR is a rough estimate. Configure <code>consumption_profile_entity</code> to point at an EMA module's published sensor for a household-specific value.</i></small>
              {% elif days[0].pv_aware_data_provenance == 'ema_blended' %}
              <br><small><i>EMA module is warming up (first 30 days). Numbers are improving day-by-day.</i></small>
              {% elif days[0].pv_aware_data_provenance == 'ema_warm' %}
              <br><small><i>EMA module is warm — CVaR reflects your actual household consumption pattern.</i></small>
              {% endif %}
              {% else %}
              _PV-aware CVaR appears here when <code>pv_capacity_kwp &gt; 0</code> is configured._
              {% endif %}

          # ── 5. Extended 7-day median forecast ──────────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "7-day spot forecast (median + 50% band)"
            graph_span: 7d
            span:
              start: day
            now:
              show: true
              label: Now
            apex_config:
              chart:
                height: 280px
              stroke:
                curve: smooth
              xaxis:
                type: datetime
              legend:
                position: top
                horizontalAlign: left
            yaxis:
              - id: price
                opposite: false
                decimals: 0
                apex_config:
                  title:
                    text: EUR/MWh
            series:
              - entity: sensor.spot_price_predictor_price_forecast
                name: P75
                yaxis_id: price
                type: area
                stroke_width: 0
                color: "#3b82f6"
                opacity: 0.18
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P75_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P25
                yaxis_id: price
                type: area
                stroke_width: 0
                color: "white"
                opacity: 1.0
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P25_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P50 forecast
                yaxis_id: price
                type: line
                stroke_width: 3
                color: "#1d4ed8"
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P50_eur_mwh]);
