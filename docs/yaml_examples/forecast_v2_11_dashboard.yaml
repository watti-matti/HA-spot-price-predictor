# ════════════════════════════════════════════════════════════════════════
# Spot Price Predictor — v2.11.0 hero dashboard
# ════════════════════════════════════════════════════════════════════════
#
# How to use this file — two paste paths:
#
#   A. AS A COMPLETE DASHBOARD (recommended — copy entire file):
#      Settings → Dashboards → + Add Dashboard → "New dashboard from scratch"
#      → open the new dashboard → ⋮ (top right) → Edit Dashboard →
#      ⋮ → Raw configuration editor → REPLACE the entire content with this
#      file → Save.
#
#   B. AS A CARD IN AN EXISTING DASHBOARD:
#      In an existing dashboard's Edit mode, click Add Card → Manual.
#      Paste ONLY the inner vertical-stack block (the card under
#      views[0].cards[0], including its child `cards:` list). Do NOT paste
#      the outer `title:` / `views:` keys — those are the dashboard wrapper.
#
# Showcases the four pieces of information the integration uniquely produces:
#
#   1. 170-hour probabilistic fan chart   — what to expect and how uncertain
#   2. D(k) cheap/peak duration curves    — the cheapest-k-hours summary
#   3. PV-aware daily risk (v2.11.0)      — downside cost from joint
#                                            price + PV uncertainty
#   4. PV-aware D(k) (when PV enabled)    — same curves, net of self-consumption
#
# Requires:
#   - custom:apexcharts-card  (HACS → Frontend)
#   - HA built-in markdown card
#
# Sensors consumed:
#   - sensor.spot_price_predictor_price_forecast       (always)
#   - sensor.spot_price_forecast_fi                    (always — Nordpool-compatible)
#   - sensor.spot_price_predictor_duration_forecast    (always)
#
# Optional sensor if Nordpool is linked:
#   - sensor.spot_price_predictor_spot_electricity_price  (realised price overlay)
#
# Adjust entity IDs in the YAML if your install uses different names.
# Cards are responsive and work on phone-width.
# ════════════════════════════════════════════════════════════════════════

title: Spot price forecast (v2.11)
views:
  - title: Forecast
    path: forecast
    icon: mdi:chart-line
    cards:
      - type: vertical-stack
        cards:

          # ── Status strip ───────────────────────────────────────────────
          # HTML tables here so HA's GUI editor cannot break the layout
          # by reformatting YAML scalars (browser ignores whitespace
          # between tags; column widths set explicitly via <colgroup>).
          - type: markdown
            content: |
              ## Forecast status
              <table style="width:100%; border-collapse:collapse; margin-top:8px;">
              <colgroup><col style="width:32%"><col style="width:30%"><col style="width:38%"></colgroup>
              <tbody>
              <tr><td style="padding:6px;"><b>Now</b></td><td style="padding:6px; text-align:right;"><b>{{ (states('sensor.spot_price_predictor_price_forecast') | float * 100) | round(1) }} c/kWh</b></td><td style="padding:6px;"><small>current hour, consumer EUR/kWh</small></td></tr>
              <tr><td style="padding:6px;"><b>Forecast (spot)</b></td><td style="padding:6px; text-align:right;"><b>{{ (states('sensor.spot_price_forecast_fi') | float * 100) | round(1) }} c/kWh</b></td><td style="padding:6px;"><small>current hour, EUR/kWh</small></td></tr>
              <tr><td style="padding:6px;"><b>Today min / avg / max</b></td><td style="padding:6px; text-align:right;">{{ (state_attr('sensor.spot_price_forecast_fi','today_min') * 100) | round(1) }} / {{ (state_attr('sensor.spot_price_forecast_fi','today_avg') * 100) | round(1) }} / {{ (state_attr('sensor.spot_price_forecast_fi','today_max') * 100) | round(1) }} c/kWh</td><td></td></tr>
              <tr><td style="padding:6px;"><b>Tomorrow avg</b></td><td style="padding:6px; text-align:right;">{{ (state_attr('sensor.spot_price_forecast_fi','tomorrow_avg') * 100) | round(1) }} c/kWh</td><td></td></tr>
              <tr><td style="padding:6px;"><b>Updated</b></td><td style="padding:6px; text-align:right;">{{ state_attr('sensor.spot_price_predictor_price_forecast','last_update') | as_datetime | relative_time }} ago</td><td style="padding:6px;">{% if state_attr('sensor.spot_price_predictor_price_forecast','stale') %}⚠ <b>stale</b> ({{ state_attr('sensor.spot_price_predictor_price_forecast','data_age_minutes') }} min){% else %}<span style="color:#16a34a;">fresh</span>{% endif %}</td></tr>
              </tbody>
              </table>

          # ── 1. Probabilistic fan chart (48h focus) ─────────────────────
          - type: custom:apexcharts-card
            header:
              show: true
              title: "48-hour spot forecast — probabilistic fan chart"
              show_states: false
            graph_span: 48h
            span:
              start: hour
              offset: -1h
            now:
              show: true
              label: Now
            apex_config:
              chart:
                height: 380px
                zoom:
                  enabled: true
              stroke:
                curve: smooth
              legend:
                position: top
                horizontalAlign: left
              xaxis:
                type: datetime
              tooltip:
                x:
                  format: "ddd HH:mm"
            yaxis:
              - id: price
                opposite: false
                min: ~0
                decimals: 0
                apex_config:
                  forceNiceScale: true
                  title:
                    text: EUR/MWh
            series:
              - entity: sensor.spot_price_predictor_price_forecast
                name: P5-P95 (90% band)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "#3b82f6"
                opacity: 0.10
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P95_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P5 (lower bound)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "white"
                opacity: 1.0
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P5_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P25-P75 (50% band)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "#3b82f6"
                opacity: 0.22
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P75_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P25 (inner lower)
                yaxis_id: price
                type: area
                curve: smooth
                stroke_width: 0
                color: "white"
                opacity: 1.0
                show:
                  legend_value: false
                  in_header: false
                  in_legend: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P25_eur_mwh]);
              - entity: sensor.spot_price_predictor_price_forecast
                name: P50 forecast
                yaxis_id: price
                type: line
                curve: smooth
                stroke_width: 3
                color: "#1d4ed8"
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const f = entity.attributes.forecast;
                  if (!f) return [];
                  return f.map(r => [new Date(r.timestamp).getTime(), r.P50_eur_mwh]);
              - entity: sensor.spot_price_predictor_spot_electricity_price
                name: Realised
                yaxis_id: price
                type: line
                curve: stepline
                stroke_width: 2
                color: "#111827"
                opacity: 1
                show:
                  legend_value: false
                  in_header: false
                  extremas: false
                  datalabels: false
                data_generator: |
                  const tl = entity.attributes.timeline;
                  if (!tl) return [];
                  const hourly = {};
                  tl.forEach(t => {
                    const d = new Date(t.timestamp);
                    const hk = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()).getTime();
                    if (!hourly[hk]) hourly[hk] = [];
                    hourly[hk].push(t.price_eur_kwh * 1000);
                  });
                  return Object.entries(hourly)
                    .map(([k, v]) => [parseInt(k), v.reduce((a,b)=>a+b,0)/v.length])
                    .sort((a,b) => a[0]-b[0]);

          # ── 2. D(k) cheapest-k-hours curve (today) ─────────────────────
          # NOTE: apexcharts-card is time-series only — a category/numeric
          # k-axis does not render. We map k=1..24 onto today's 24 hours
          # (timestamps) and relabel the axis/tooltip back to "k".
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Today's cheapest-k-hours mean price"
            graph_span: 24h
            span:
              start: day
            apex_config:
              chart:
                height: 240px
                type: line
              stroke:
                curve: smooth
                width: 3
              xaxis:
                type: datetime
                title:
                  text: k (number of hours)
                labels:
                  datetimeUTC: false
                  formatter: |
                    EVAL: function (value, timestamp) {
                      var ms = (timestamp != null) ? timestamp : value;
                      return 'k' + (new Date(ms).getHours() + 1);
                    }
              tooltip:
                shared: true
                x:
                  formatter: |
                    EVAL: function (val) { return 'k = ' + (new Date(val).getHours() + 1); }
            yaxis:
              - id: price
                opposite: false
                decimals: 1
                apex_config:
                  title:
                    text: c/kWh
            series:
              # All three lines resolve the SAME day via an identical
              # predicate (prefer today, else the first FORECAST day) so grid
              # and PV-aware are read from the same prices. Independent
              # fallbacks would let the grid line land on a historical day
              # while PV lands on a forecast day, making PV-aware appear
              # higher than grid — impossible when self-consumed PV is free.
              - entity: sensor.spot_price_predictor_duration_forecast
                name: cheap k-h (grid)
                yaxis_id: price
                type: line
                color: "#1d4ed8"
                show:
                  legend_value: false
                  extremas: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days || !days.length) return [];
                  const t = new Date();
                  const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
                  const has = d => d.dk_cheap_eur_kwh && d.dk_peak_eur_kwh;
                  const day = days.find(d => d.date === iso && has(d))
                           || days.find(d => d.source === 'forecast' && has(d))
                           || days.find(has);
                  if (!day) return [];
                  const b = new Date(); b.setHours(0,0,0,0); const base = b.getTime();
                  return day.dk_cheap_eur_kwh.map((v, i) => [base + i*3600000, v * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: cheap k-h (PV-aware)
                yaxis_id: price
                type: line
                color: "#16a34a"
                stroke_dash: 6
                show:
                  legend_value: false
                  extremas: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days || !days.length) return [];
                  const t = new Date();
                  const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
                  const has = d => d.dk_cheap_eur_kwh && d.dk_peak_eur_kwh;
                  const day = days.find(d => d.date === iso && has(d))
                           || days.find(d => d.source === 'forecast' && has(d))
                           || days.find(has);
                  if (!day || !day.dk_cheap_pv_eur_kwh) return [];
                  const b = new Date(); b.setHours(0,0,0,0); const base = b.getTime();
                  return day.dk_cheap_pv_eur_kwh.map((v, i) => [base + i*3600000, v * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: peak k-h (grid)
                yaxis_id: price
                type: line
                color: "#dc2626"
                opacity: 0.6
                show:
                  legend_value: false
                  extremas: false
                data_generator: |
                  const days = entity.attributes.daily_forecast;
                  if (!days || !days.length) return [];
                  const t = new Date();
                  const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
                  const has = d => d.dk_cheap_eur_kwh && d.dk_peak_eur_kwh;
                  const day = days.find(d => d.date === iso && has(d))
                           || days.find(d => d.source === 'forecast' && has(d))
                           || days.find(has);
                  if (!day) return [];
                  const b = new Date(); b.setHours(0,0,0,0); const base = b.getTime();
                  return day.dk_peak_eur_kwh.map((v, i) => [base + i*3600000, v * 100]);

          # ── 2b. 7-day duration overview: cheap/peak + PV-compensated ───
          #   Solid = grid consumer price; dashed (stroke_dash 2) = PV-aware.
          #   Y-axis is dynamic but snaps to 10 c/kWh with horizontal grid
          #   anchors; min always includes 0 so negative (export) values show.
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Daily Cost by Usage Duration — 7 day (c/kWh)"
              show_states: false
            graph_span: 7d
            span:
              start: day
            yaxis:
              - id: dk
                decimals: 1
                apex_config:
                  forceNiceScale: true
                  min: |
                    EVAL: function (min) { return Math.floor(Math.min(min, 0) / 10) * 10; }
                  max: |
                    EVAL: function (max) { return Math.ceil(max / 10) * 10; }
                  labels:
                    formatter: |
                      EVAL: function (val) { return val.toFixed(0); }
            apex_config:
              chart:
                height: 600
              grid:
                show: true
                borderColor: "rgba(120,120,120,0.25)"
                yaxis:
                  lines:
                    show: false          # 10 c anchors come from annotations below
              # Highlighted 10 c/kWh scale indicators. The 0-line (breakeven)
              # is solid + emphasized; the 10/20/30/40 lines are dashed.
              # NOTE: these live under apex_config.annotations.yaxis — NOT the
              # card-level `yaxis:` axis list — or the colors won't apply.
              annotations:
                yaxis:
                  - y: 0
                    borderColor: "#374151"
                    borderWidth: 2
                    strokeDashArray: 0
                  - y: 10
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 20
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 30
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
                  - y: 40
                    borderColor: "#60a5fa"
                    borderWidth: 1
                    strokeDashArray: 4
              xaxis:
                type: datetime
                labels:
                  datetimeUTC: false
                  format: ddd dd.MM
                  # Labels sit at the midnight day boundary; data points are
                  # plotted at noon. There is NO resolution-independent way to
                  # center datetime labels under arbitrary point positions in
                  # apexcharts-card (xaxis.min/max can't be functions, a fixed
                  # offsetX is pixel-hardcoded and breaks across screen sizes).
                  # Boundary labels are responsive and standard for HA time
                  # charts. For exact, resize-proof centering, a card with a
                  # native category axis (e.g. plotly-graph-card) is required.
              stroke:
                width: 4
                curve: smooth
              legend:
                show: true
                position: top
                formatter: |
                  EVAL: function(seriesName, opts) {
                    var series = opts.w.config.series[opts.seriesIndex];
                    if (!series || !series.data || series.data.length === 0) {
                      return seriesName;
                    }
                    var firstPoint = series.data[1];
                    var v = Array.isArray(firstPoint) ? firstPoint[1] : firstPoint;
                    return seriesName + ': ' + (v != null ? v.toFixed(1) + ' c/kWh' : '–');
                  }
              markers:
                size: 4
              tooltip:
                shared: true
                x:
                  format: dddd
            series:
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Peak(1)
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#22d3ee"
                curve: straight
                stroke_dash: 5
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(),
                  d.dk_peak_eur_kwh[0] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Peak(4)
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#facc15"
                curve: straight
                stroke_dash: 5
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(),
                  d.dk_peak_eur_kwh[3] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Peak(8)
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#f97316"
                curve: straight
                stroke_dash: 5
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(),
                  d.dk_peak_eur_kwh[7] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Average(24)
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#ef4444"
                curve: straight
                stroke_dash: 5
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(),
                  d.dk_peak_eur_kwh[23] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Cheap(8)
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#f97316"
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(),
                  d.dk_cheap_eur_kwh[7] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Cheap(4)
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#facc15"
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(),
                  d.dk_cheap_eur_kwh[3] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Cheapest(1)
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#22d3ee"
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.map((d) => [new Date(d.date + 'T12:00:00').getTime(),
                  d.dk_cheap_eur_kwh[0] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Average(24) PV
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#ef4444"
                curve: straight
                stroke_dash: 2
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.filter((d) => Array.isArray(d.dk_peak_pv_eur_kwh) &&
                  d.dk_peak_pv_eur_kwh.length === 24).map((d) => [new Date(d.date +
                  'T12:00:00').getTime(), d.dk_peak_pv_eur_kwh[23] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Cheap(8) PV
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#f97316"
                curve: straight
                stroke_dash: 2
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.filter((d) => Array.isArray(d.dk_cheap_pv_eur_kwh) &&
                  d.dk_cheap_pv_eur_kwh.length === 24).map((d) => [new Date(d.date +
                  'T12:00:00').getTime(), d.dk_cheap_pv_eur_kwh[7] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Cheap(4) PV
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#facc15"
                curve: straight
                stroke_dash: 2
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.filter((d) => Array.isArray(d.dk_cheap_pv_eur_kwh) &&
                  d.dk_cheap_pv_eur_kwh.length === 24).map((d) => [new Date(d.date +
                  'T12:00:00').getTime(), d.dk_cheap_pv_eur_kwh[3] * 100]);
              - entity: sensor.spot_price_predictor_duration_forecast
                name: Cheapest(1) PV
                yaxis_id: dk
                type: line
                float_precision: 1
                unit: " c/kWh"
                color: "#22d3ee"
                curve: straight
                stroke_dash: 2
                show:
                  legend_value: false
                data_generator: >
                  const dk = entity.attributes.daily_forecast; if (!dk) return []; return
                  dk.filter((d) => Array.isArray(d.dk_cheap_pv_eur_kwh) &&
                  d.dk_cheap_pv_eur_kwh.length === 24).map((d) => [new Date(d.date +
                  'T12:00:00').getTime(), d.dk_cheap_pv_eur_kwh[0] * 100]);

          # ── 2c. Duration & risk cockpit (composite) ────────────────────
          # One self-contained "cockpit": the cheap→peak spread for the week
          # on top, then the single BEST upcoming day (cheapest by daily mean)
          # broken out into (left) its duration curve "how long can I run a
          # load and at what price" and (right) a plain-language risk & PV
          # ledger. The curve card and the ledger card resolve the SAME day
          # with an identical predicate, so they never disagree.
          - type: vertical-stack
            cards:
              # ── DAY PICKER ─────────────────────────────────────────────
              # Drives the duration curve + ledger below so you can inspect
              # the day you actually decide on (rolling horizon) — not just
              # the cheapest. "Cheapest upcoming" keeps the auto-pick.
              # Requires an input_select helper. Create it once via
              # Settings → Devices & Services → Helpers → Dropdown, OR add to
              # configuration.yaml:
              #
              #   input_select:
              #     spp_cockpit_day:
              #       name: SPP cockpit day
              #       icon: mdi:calendar-search
              #       initial: Tomorrow
              #       options:
              #         - Cheapest upcoming
              #         - Today
              #         - Tomorrow
              #         - In 2 days
              #         - In 3 days
              #         - In 4 days
              #         - In 5 days
              #         - In 6 days
              #
              # If the helper is absent, the cards fall back to the cheapest
              # upcoming day, so the cockpit still works before you create it.
              - type: entities
                title: Day to inspect
                entities:
                  - entity: input_select.spp_cockpit_day
                    name: Day
              # ── TOP: 7-day cheap→peak spread ───────────────────────────
              - type: custom:apexcharts-card
