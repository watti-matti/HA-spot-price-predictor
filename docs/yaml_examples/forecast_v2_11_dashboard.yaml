                          else { const off = {'Today':0,'Tomorrow':1,'In 2 days':2,'In 3 days':3,'In 4 days':4,'In 5 days':5,'In 6 days':6}[sel]; const t = new Date(); t.setHours(0,0,0,0); t.setDate(t.getDate() + (off==null?1:off)); const iso = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; best = days.find(d => d.date === iso && has(d)) || null; }
