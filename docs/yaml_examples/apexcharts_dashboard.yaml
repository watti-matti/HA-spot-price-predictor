# ApexCharts Dashboard for Spot Price Predictor
# ================================================
# Requires: custom:apexcharts-card (install via HACS Frontend)
#
# Shows actual Nordpool prices vs forecast for ground truth comparison,
# plus weighted wind speed as the key price driver.
#
# Configure your Nordpool entity in the integration settings.
# Adjust entity names if your installation uses different names.

type: custom:apexcharts-card
graph_span: 7d
experimental:
  color_threshold: true
show:
  last_updated: true
header:
  show: true
  show_states: true
  colorize_states: true
apex_config:
  chart:
    height: 500px
    toolbar:
      show: true
    zoom:
      enabled: true
  stroke:
    curve: smooth
  xaxis:
    type: datetime
  legend:
    position: top
    horizontalAlign: left
yaxis:
  - id: price
    opposite: false
    min: 0
    max: ~40
    decimals: 1
    apex_config:
      forceNiceScale: true
      title:
        text: Price (c/kWh)
  - id: wind
    opposite: true
    min: 0
    max: ~25
    decimals: 0
    apex_config:
      forceNiceScale: true
      title:
        text: Wind (m/s)
span:
  start: day
  offset: +0d
now:
  show: true
  label: Now
series:
  # ── Actual Nordpool Consumer Price (ground truth) ──────────────
  # Uses the processed timeline from spot_electricity_price sensor.
  # Step-line shows actual hourly prices up to current time.
  - entity: sensor.spot_price_predictor_spot_electricity_price
    yaxis_id: price
    name: Actual Consumer Price
    unit: c/kWh
    type: area
    curve: stepline
    stroke_width: 2
    color: lightblue
    opacity: 0.6
    float_precision: 2
    extend_to: now
    show:
      in_header: true
      in_chart: true
      extremas: false
      datalabels: false
      legend_value: false
    color_threshold:
      - value: 5
        color: "#8ee80e"
      - value: 10
        color: "#a0b40b"
      - value: 15
        color: "#b28008"
      - value: 20
        color: "#c44c05"
      - value: 30
        color: "#d61600"
    data_generator: |
      const timeline = entity.attributes.timeline;
      if (!timeline) return [];
      return timeline.map(t => [
        new Date(t.timestamp).getTime(),
        Math.max(0, t.price_eur_kwh * 100)
      ]);

  # ── Forecast Consumer Price ────────────────────────────────────
  # Model prediction extending into the future.
  - entity: sensor.spot_price_predictor_consumer_price
    yaxis_id: price
    name: Forecast Consumer Price
    unit: c/kWh
    color: grey
    opacity: 1
    stroke_width: 3
    show:
      legend_value: false
      in_header: false
      in_chart: true
      extremas: false
      datalabels: false
    color_threshold:
      - value: 5
        color: "#8ee80e"
      - value: 8
        color: "#b5cc09"
      - value: 12
        color: "#d4a006"
      - value: 16
        color: "#c44c05"
      - value: 25
        color: "#d61600"
    data_generator: |
      const forecast = entity.attributes.forecast;
      if (!forecast) return [];
      return forecast.map(f => [
        new Date(f.timestamp).getTime(),
        Math.max(0, f.price_eur_kwh * 100)
      ]);

  # ── Forecast Week Average (reference line) ─────────────────────
  - entity: sensor.spot_price_predictor_week_price_stats
    yaxis_id: price
    name: Forecast Week Average
    unit: c/kWh
    color: orange
    opacity: 0.8
    stroke_width: 2
    type: line
    show:
      legend_value: true
      in_header: true
      in_chart: true
      extremas: false
      datalabels: false
    data_generator: >
      const avg = entity.attributes.week_avg;

      if (!avg) return [];

      const forecast =
      hass.states['sensor.spot_price_predictor_consumer_price']?.attributes?.forecast;

      if (!forecast || forecast.length === 0) return [];

      const avgCents = avg * 100;

      return forecast.map(f => [new Date(f.timestamp).getTime(), avgCents]);

  # ── Weighted Wind Speed Forecast ───────────────────────────────
  # Wind is the #1 driver of Finnish electricity prices.
  - entity: sensor.spot_price_predictor_spot_price_forecast
    yaxis_id: wind
    name: Wind Forecast (weighted)
    unit: m/s
    color: "#38bdf8"
    opacity: 0.7
    stroke_width: 2
    show:
      legend_value: false
      in_header: false
      in_chart: true
      extremas: false
      datalabels: false
    data_generator: |
      const forecast = entity.attributes.forecast;
      if (!forecast || !forecast[0]?.wind_weighted) return [];
      return forecast.map(f => [
        new Date(f.timestamp).getTime(),
        f.wind_weighted || 0
      ]);
