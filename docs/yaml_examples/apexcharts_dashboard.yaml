# ApexCharts Dashboard for Spot Price Predictor
# ================================================
# Requires: custom:apexcharts-card (install via HACS Frontend)
#
# Shows:
#   - Actual consumer price from Nordpool (ground truth)
#   - Forecast consumer price (prediction)
#   - PV selling price (for solar panel owners, optional)
#   - Weekly average reference line
#   - Weighted wind speed (key price driver)
#
# Configure your Nordpool entity in the integration settings.
# Adjust entity names if your installation uses different names.

# ── Status Card (place above the chart) ──────────────────────────
# Shows last update time, active prediction tier, and staleness warning.
# Copy this as a separate Markdown card in your dashboard.
#
# type: markdown
# content: >
#   **Last update:**
#   {{ state_attr('sensor.spot_price_predictor_spot_price_forecast', 'last_update')
#      | as_datetime | relative_time }} ago
#   | **Tiers:**
#   {{ state_attr('sensor.spot_price_predictor_spot_price_forecast', 'tiers_active') }}
#   {% if state_attr('sensor.spot_price_predictor_spot_price_forecast', 'stale') %}
#   | Data is stale
#   ({{ state_attr('sensor.spot_price_predictor_spot_price_forecast', 'data_age_minutes') }} min old)
#   {% endif %}

type: custom:apexcharts-card
graph_span: 7d
experimental:
  color_threshold: true
show:
  last_updated: true
header:
  show: true
  show_states: true
  colorize_states: true
apex_config:
  chart:
    height: 500px
    toolbar:
      show: true
    zoom:
      enabled: true
  stroke:
    curve: smooth
  xaxis:
    type: datetime
  legend:
    position: top
    horizontalAlign: left
yaxis:
  - id: price
    opposite: false
    min: 0
    max: ~40
    decimals: 1
    apex_config:
      forceNiceScale: true
      title:
        text: Price (c/kWh)
  - id: wind
    opposite: true
    min: 0
    max: ~25
    decimals: 0
    apex_config:
      forceNiceScale: true
      title:
        text: Wind (m/s)
span:
  start: day
  offset: +0d
now:
  show: true
  label: Now
series:
  # ── Actual Consumer Price (ground truth, includes all overhead) ──
  # Source data may be 15-min resolution; resample to hourly for chart
  - entity: sensor.spot_price_predictor_spot_electricity_price
    yaxis_id: price
    name: Actual Consumer Price
    unit: c/kWh
    type: area
    curve: stepline
    stroke_width: 2
    color: lightblue
    opacity: 0.6
    float_precision: 2
    extend_to: false
    show:
      in_header: true
      in_chart: true
      extremas: false
      datalabels: false
      legend_value: false
    color_threshold:
      - value: 5
        color: "#8ee80e"
      - value: 10
        color: "#a0b40b"
      - value: 15
        color: "#b28008"
      - value: 20
        color: "#c44c05"
      - value: 30
        color: "#d61600"
    data_generator: |
      const timeline = entity.attributes.timeline;
      if (!timeline) return [];
      const hourly = {};
      timeline.forEach(t => {
        const d = new Date(t.timestamp);
        const hk = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()).getTime();
        if (!hourly[hk]) hourly[hk] = [];
        hourly[hk].push(t.price_eur_kwh);
      });
      return Object.entries(hourly).map(([k, v]) => [
        parseInt(k), Math.max(0, (v.reduce((a,b)=>a+b,0)/v.length) * 100)
      ]).sort((a,b) => a[0]-b[0]);

  # ── Forecast Consumer Price ────────────────────────────────────
  - entity: sensor.spot_price_predictor_consumer_price
    yaxis_id: price
    name: Forecast Consumer Price
    unit: c/kWh
    color: grey
    opacity: 1
    stroke_width: 3
    show:
      legend_value: false
      in_header: false
      in_chart: true
      extremas: false
      datalabels: false
    color_threshold:
      - value: 5
        color: "#8ee80e"
      - value: 8
        color: "#b5cc09"
      - value: 12
        color: "#d4a006"
      - value: 16
        color: "#c44c05"
      - value: 25
        color: "#d61600"
    data_generator: |
      const forecast = entity.attributes.forecast;
      if (!forecast) return [];
      return forecast.map(f => [
        new Date(f.timestamp).getTime(),
        Math.max(0, f.price_eur_kwh * 100)
      ]);

  # ── PV Selling Price (optional, only if sensor exists) ─────────
  # Remove this section if you don't have solar panels.
  # Source data may be 15-min resolution; resample to hourly for chart
  - entity: sensor.spot_price_predictor_spot_electricity_selling_price
    yaxis_id: price
    name: PV Selling Price
    unit: c/kWh
    type: line
    curve: stepline
    stroke_width: 1
    color: "#fbbf24"
    opacity: 0.7
    extend_to: false
    show:
      legend_value: false
      in_header: false
      in_chart: true
      extremas: false
      datalabels: false
    data_generator: |
      const timeline = entity.attributes.timeline;
      if (!timeline) return [];
      const hourly = {};
      timeline.forEach(t => {
        const d = new Date(t.timestamp);
        const hk = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()).getTime();
        if (!hourly[hk]) hourly[hk] = [];
        hourly[hk].push(t.price_eur_kwh);
      });
      return Object.entries(hourly).map(([k, v]) => [
        parseInt(k), Math.max(0, (v.reduce((a,b)=>a+b,0)/v.length) * 100)
      ]).sort((a,b) => a[0]-b[0]);

  # ── Forecast Week Average (reference line) ─────────────────────
  - entity: sensor.spot_price_predictor_week_price_stats
    yaxis_id: price
    name: Forecast Week Average
    unit: c/kWh
    color: orange
    opacity: 0.8
    stroke_width: 2
    type: line
    show:
      legend_value: true
      in_header: true
      in_chart: true
      extremas: false
      datalabels: false
    data_generator: >
      const avg = entity.attributes.week_avg;

      if (!avg) return [];

      const forecast =
      hass.states['sensor.spot_price_predictor_consumer_price']?.attributes?.forecast;

      if (!forecast || forecast.length === 0) return [];

      const avgCents = avg * 100;

      return forecast.map(f => [new Date(f.timestamp).getTime(), avgCents]);

  # ── Weighted Wind Speed Forecast ───────────────────────────────
  - entity: sensor.spot_price_predictor_spot_price_forecast
    yaxis_id: wind
    name: Wind Forecast (weighted)
    unit: m/s
    color: "#38bdf8"
    opacity: 0.7
    stroke_width: 2
    show:
      legend_value: false
      in_header: false
      in_chart: true
      extremas: false
      datalabels: false
    data_generator: |
      const forecast = entity.attributes.forecast;
      if (!forecast || !forecast[0]?.wind_weighted) return [];
      return forecast.map(f => [
        new Date(f.timestamp).getTime(),
        f.wind_weighted || 0
      ]);
