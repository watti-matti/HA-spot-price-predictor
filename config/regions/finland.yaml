# ============================================================================
# Finland Region Configuration
# ============================================================================
# This file defines all data sources, locations, features, holidays, and
# consumer pricing for the Finnish electricity market.
#
# The training pipeline and HA YAML generator both read this file.
# To adapt the system for another region, create a new YAML file
# following this structure (e.g., sweden.yaml, estonia.yaml).
# ============================================================================

region:
  name: "Finland"
  timezone: "Europe/Helsinki"
  latitude: 62.0                     # Representative latitude for daylight calculation
  currency: "EUR"
  bidding_zone: "FI"

# ============================================================================
# Price data source (REQUIRED)
# ============================================================================
price_source:
  name: "sahkotin"
  url: "https://sahkotin.fi/prices"
  unit: "EUR/MWh"                    # Raw unit from API
  divisor: 1                         # API returns value directly in EUR/MWh
  vat_param: false                   # Whether to request VAT-included prices

# ============================================================================
# Weather data source (REQUIRED)
# ============================================================================
weather_source:
  name: "open-meteo"
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  archive_url: "https://historical-forecast-api.open-meteo.com/v1/forecast"
  wind_height_m: 120                 # Hub height for wind speed
  solar_tilt_deg: 45                 # Panel tilt angle (south-facing)
  variables:
    wind: "wind_speed_120m"
    solar: "global_tilted_irradiance_instant"
    temperature: "temperature_2m"

  # 7 Finnish locations with capacity-based weighting
  # Wind weights: Finnish Wind Power Association (FWPA) 2024 capacity register
  # Solar weights: Energiavirasto 2024 solar plant register + RENEWFM EU data
  # Temp weights: Population-based (drives consumption patterns)
  locations:
    - name: "Raahe coast (Kalajoki-Raahe)"
      lat: 64.25
      lon: 24.40
      wind_weight: 0.22             # Largest wind cluster
      solar_weight: 0.08
      temp_weight: 0.05

    - name: "Rauma / SW Satakunta"
      lat: 61.10
      lon: 21.50
      wind_weight: 0.12
      solar_weight: 0.22            # Largest solar farm (32 MW Lakari)
      temp_weight: 0.08

    - name: "Ii-Simo, N. Ostrobothnia coast"
      lat: 65.30
      lon: 25.40
      wind_weight: 0.18             # Fastest-growing wind corridor
      solar_weight: 0.06
      temp_weight: 0.05

    - name: "Joroinen, Eastern Finland"
      lat: 62.18
      lon: 27.83
      wind_weight: 0.05
      solar_weight: 0.20            # 230 MWp planned solar
      temp_weight: 0.10

    - name: "Helsinki / Uusimaa"
      lat: 60.17
      lon: 24.94
      wind_weight: 0.04
      solar_weight: 0.24            # Dense rooftop solar (Kivikko 850 kWp)
      temp_weight: 0.38             # 38% population -> highest consumption density

    - name: "Lapua / S. Ostrobothnia"
      lat: 62.97
      lon: 23.00
      wind_weight: 0.10
      solar_weight: 0.12            # EPV solar + Palloneva project
      temp_weight: 0.12

    - name: "Kolari-Muonio fells, Lapland"
      lat: 67.30
      lon: 23.80
      wind_weight: 0.08             # Arctic wind resource
      solar_weight: 0.04
      temp_weight: 0.05

    # Note: Remaining wind weight (0.21) is captured by proximity
    # of sensors 1 & 3 to Lestijärvi + Pyhäjoki clusters
    # Total weights: wind=0.79+0.21 residual, solar=0.96, temp=0.83

# ============================================================================
# Cross-border price sources (OPTIONAL, free, no auth)
# ============================================================================
# Used to compute 7-day rolling average price spreads,
# from which import_potential_xx and export_potential_xx features are derived.
#
# Verified by analysis (Oct 2025 - Apr 2026, 27 weeks):
#   FI-SE1 spread: lag-1 autocorrelation 0.662, sign persistence 100%
#   FI-SE3 spread: lag-1 autocorrelation 0.543, sign persistence 100%
#   FI-EE  spread: lag-1 autocorrelation 0.733, sign persistence 100%

neighbor_price_sources:
  - name: "elpriset_se1"
    url: "https://www.elprisetjustnu.se/api/v1/prices/{year}/{mmdd}_{zone}.json"
    zone: "SE1"
    unit: "eur_per_kwh"              # API returns EUR/kWh
    to_eur_mwh_factor: 1000          # Multiply by 1000 to get EUR/MWh
    feature_prefix: "se1"
    bulk_history: true               # Day-by-day but fast, history from 2022
    use_for: "both"
    source_type: "elpriset"

  - name: "elpriset_se3"
    url: "https://www.elprisetjustnu.se/api/v1/prices/{year}/{mmdd}_{zone}.json"
    zone: "SE3"
    unit: "eur_per_kwh"
    to_eur_mwh_factor: 1000
    feature_prefix: "se3"
    bulk_history: true
    use_for: "both"
    source_type: "elpriset"

  - name: "elering_ee"
    url: "https://dashboard.elering.ee/api/nps/price"
    zone: "EE"
    unit: "eur_per_mwh"              # API returns EUR/MWh directly
    to_eur_mwh_factor: 1
    feature_prefix: "ee"
    resolution: "15min"              # Needs hourly resampling
    bulk_history: true               # Supports bulk historical queries
    use_for: "both"                  # Training + HA inference

spread_window_days: 7                # Rolling average window for spread calculation

# ============================================================================
# Grid data sources (OPTIONAL, requires free API key)
# ============================================================================
# Skipped automatically if FINGRID_API_KEY env var is missing.
# Register for free at https://data.fingrid.fi

grid_sources:
  # Nuclear production is used to derive the nuclear_x_scarcity interaction
  # feature (nuclear deficit x weather scarcity). Raw nuclear_mw and flow
  # features were removed due to sign instability in Ridge regression.
  - name: "fingrid_nuclear"
    env_key: "FINGRID_API_KEY"
    url: "https://data.fingrid.fi/api/datasets/188/data"
    feature_name: "nuclear_mw"
    max_value: 4372                  # Total Finnish nuclear capacity (MW)
    resolution: "3min"               # Needs hourly aggregation
    update_interval_hours: 1

  # ─── v2.2: net-load features ──────────────────────────────────────
  # Together with nuclear_mw above, these three series feed
  #     net_load_gw = (consumption - wind - solar - nuclear) / 1000
  # which the empirical study (`fingrid_netload_study.py`) showed has
  # cor 0.80 with FI prices and explains 46 % of the AR(2) baseline
  # residual variance — the strongest single feature improvement we've
  # measured. The dataset IDs are Fingrid's day-ahead forecasts; the
  # integration's runtime fetcher uses the same IDs.
  - name: "fingrid_consumption_forecast"
    env_key: "FINGRID_API_KEY"
    url: "https://data.fingrid.fi/api/datasets/165/data"
    feature_name: "consumption_mw"
    max_value: 1                       # Keep raw MW (no normalisation)
    resolution: "15min"
    update_interval_hours: 1

  - name: "fingrid_wind_forecast"
    env_key: "FINGRID_API_KEY"
    url: "https://data.fingrid.fi/api/datasets/246/data"
    feature_name: "wind_forecast_mw"
    max_value: 1                       # Keep raw MW
    resolution: "15min"
    update_interval_hours: 1

  - name: "fingrid_solar_forecast"
    env_key: "FINGRID_API_KEY"
    url: "https://data.fingrid.fi/api/datasets/247/data"
    feature_name: "solar_forecast_mw"
    max_value: 1                       # Keep raw MW
    resolution: "15min"
    update_interval_hours: 1

  # Installed PV capacity envelope (Fingrid dataset 267, "Total solar PV
  # capacity"). Slow-moving. Combined with Open-Meteo irradiance this
  # yields a capacity-aware solar GENERATION estimate that (a) is available
  # for the FULL forecast horizon — dataset 247 above is day-ahead only —
  # and (b) tracks the PV build-out that raw irradiance is blind to. Feeds
  # net_load so solar enters price with the correct (downward) sign.
  - name: "fingrid_solar_capacity"
    env_key: "FINGRID_API_KEY"
    url: "https://data.fingrid.fi/api/datasets/267/data"
    feature_name: "solar_capacity_mw"
    max_value: 1                       # Keep raw MW (installed capacity)
    resolution: "1d"
    update_interval_hours: 24

  # Installed WIND capacity envelope (Fingrid dataset 268, "Total production
  # capacity used in the wind power forecast"). The wind analogue of 267:
  # combined with the turbine power-curve term (sigmoid_wind_rho) it makes
  # wind's price-depression capacity-aware, so it tracks the wind build-out
  # (and future changes) instead of assuming a fixed fleet.
  - name: "fingrid_wind_capacity"
    env_key: "FINGRID_API_KEY"
    url: "https://data.fingrid.fi/api/datasets/268/data"
    feature_name: "wind_capacity_mw"
    max_value: 1                       # Keep raw MW (installed capacity)
    resolution: "1d"
    update_interval_hours: 24

# ============================================================================
# Demand modeling parameters
# ============================================================================
demand:
  hdd_threshold: 17.0                # Heating Degree Day base temperature (C)
                                     # Tuned for Finnish building stock; no AC needed
                                     # (<1% AC penetration in Finland)

  # Peak hours verified from 1-year spot price analysis (Apr 2025 - Apr 2026)
  # Actual workday AM peak = hour 9 (9.1 EUR/MWh)
  # Actual workday PM peak = hour 19 (8.3 EUR/MWh)
  # PM peak shifts seasonally: hour 17 (winter) to 20 (summer), r=0.91 with daylight
  # Fixed 9/19 reduces peak center error by 39% vs original 8/18
  peak_am_center: 9
  peak_am_sigma: 1.8
  peak_pm_center: 19
  peak_pm_sigma: 2.0

  sauna_hours: [20, 21]              # Cultural load spike (Fri/Sat evenings)
  sauna_days: ["friday", "saturday"]
  monday_ramp_hours: [6, 7, 8, 9]   # Factory cold-start after weekend

  wind_rated_speed: 14               # Rated wind speed (m/s) for power density cap

# ============================================================================
# Holidays
# ============================================================================
# Python training pipeline: uses holidays.py with these rules
# Home Assistant deployment: two options
#   Option A (recommended): HA Workday integration (binary_sensor.workday_sensor)
#     - Automatically resolves Finnish holidays and weekends
#     - Zero maintenance, updated by HA community
#   Option B: Hardcoded rules from this config
#     - More portable, no HA integration dependency

holidays:
  ha_workday_integration: true       # If true, generated YAML uses workday.check_date
  country_code: "FI"                 # For HA Workday integration

  fixed:
    - { month: 1,  day: 1,  name: "New Year's Day" }
    - { month: 1,  day: 6,  name: "Epiphany" }
    - { month: 5,  day: 1,  name: "May Day (Vappu)" }
    - { month: 6,  day: 4,  name: "Flag Day of the Defence Forces" }
    - { month: 12, day: 6,  name: "Independence Day" }
    - { month: 12, day: 24, name: "Christmas Eve" }
    - { month: 12, day: 25, name: "Christmas Day" }
    - { month: 12, day: 26, name: "St. Stephen's Day" }

  easter_based:                      # Days relative to Easter Sunday
    - { offset: -2,  name: "Good Friday" }
    - { offset: 0,   name: "Easter Sunday" }
    - { offset: 1,   name: "Easter Monday" }
    - { offset: 39,  name: "Ascension Day" }
    - { offset: 49,  name: "Whit Sunday" }

  special_rules:
    - { type: "midsummer", name: "Midsummer Eve" }       # Friday between Jun 19-25
    - { type: "midsummer_day", name: "Midsummer Day" }   # Saturday between Jun 20-26
    - { type: "all_saints", name: "All Saints' Day" }    # Saturday between Oct 31 - Nov 6

# ============================================================================
# Consumer pricing
# ============================================================================
# All values in EUR unless otherwise noted.
# Operators define day/night transfer tariffs.
# Day = Mon-Fri 07:00-22:00 local time
# Night = Mon-Fri 22:00-07:00 + all Sat/Sun

consumer_pricing:
  vat_multiplier: 1.255              # 25.5% VAT (updated Sep 2024)
  energy_tax_eur_kwh: 0.02325        # Electricity tax class I (2026)
  seller_margin_eur_kwh: 0.0         # Energy seller's margin (excl. VAT, from contract)

  operators:
    - name: "Elenia"
      day_rate_eur_kwh: 0.0361       # Updated April 2026
      night_rate_eur_kwh: 0.0220     # Updated April 2026

    - name: "Caruna Espoo"
      day_rate_eur_kwh: 0.0221
      night_rate_eur_kwh: 0.0221

    - name: "Caruna North"
      day_rate_eur_kwh: 0.0407
      night_rate_eur_kwh: 0.0249

    - name: "Helen"
      day_rate_eur_kwh: 0.0354
      night_rate_eur_kwh: 0.0354

  default_operator: "Elenia"

# ============================================================================
# Feature engineering parameters
# ============================================================================
# These thresholds define nonlinear feature transforms.
# Derived from Finnish wind/price analysis but may need tuning for other regions.

features:
  # Wind nonlinear transforms
  wind_log_scarcity_base: 8.0        # log1p(max(0, base - wind_speed))
                                     # Captures price spike when wind drops below 8 m/s
  wind_calm_threshold: 6.0           # max(0, threshold - wind_speed)
                                     # Interaction with peak demand hours
  wind_low_threshold: 5.0            # For nuclear x scarcity interaction

  # AR neighbor price normalization
  ar_normalize_divisor: 100          # AR features divided by this to ~unit scale
                                     # SE1/SE3/EE prices typically 0-80 EUR/MWh -> 0-0.8

  # AR stability
  ar_max_root: 0.95                  # Damp AR(2) roots if |root| > this
                                     # Ensures stable 170h forecast horizon
  ar_split_frac: 0.85                # Train/test split for AR model fitting

  # Time cycles (derived from equations, not tunable)
  # hour_sin/cos: sin/cos(2*pi*hour/24)  — fixed by definition
  # month_sin/cos: sin/cos(2*pi*month/12) — fixed by definition

# ============================================================================
# Model training parameters
# ============================================================================
training:
  years: 4                           # Historical data window
  test_split: 0.15                   # 85/15 time-ordered split
  half_life_days: 120                # Exponential time-decay half-life (optimized: 120d best MAE)
  ridge_alpha: 1.0                   # Ridge regularization strength
  batch_size: 512                    # Batch size for memory-efficient training
  log_offset: 55                     # Log-linear: log(price + offset), handles negative prices
                                     # Must exceed |min_price|; Finnish min ≈ -50 EUR/MWh
                                     # Power stretch fitted automatically via Nelder-Mead
  forecast_hours: 170                # Forecast window (7.08 days)

  # Power stretch bounds (Nelder-Mead optimization)
  power_scale_min: 0.0               # scale > 0 constraint
  power_exp_min: 0.5                 # power exponent lower bound
  power_exp_max: 3.0                 # power exponent upper bound
  power_optim_maxiter: 1000          # Nelder-Mead max iterations
  power_optim_tol: 0.001             # Nelder-Mead convergence tolerance

# ============================================================================
# Duration model parameters (D(k) = CVaR_{k/24})
# ============================================================================
# Segment-hierarchical Ridge regression predicting duration-sorted prices.
# Each segment x level has its own Ridge model; PAVA enforces D(k) monotonicity.

duration_model:
  log_offset: 55                     # Same as hourly model: log(D(k) + offset)
  lambda: 0.960                      # Forgetting factor; half-life = -ln(2)/ln(lambda)
                                     # 0.960 -> 17 days; optimal from sweep [0.950, 1.000]
                                     # Sweep result: 0.950-0.960 peak at mean rho=0.900
  ridge_alpha: 1.0                   # Ridge regularization (same as hourly)
  min_train_days: 180                # Minimum expanding window before evaluation
  exp_cap: 20.0                      # Cap linear predictor: exp(20) ≈ 485M, prevents overflow

  # Segment definitions: which hours belong to each segment
  # Boundaries aligned with day/night tariff (07 and 22)
  # Total must be 24 hours, segments must not overlap
  segments:
    night:   [22, 23, 0, 1, 2, 3, 4, 5, 6]  # 9 hours (night tariff 22-07)
    morning: [7, 8, 9, 10, 11]               # 5 hours (day tariff)
    midday:  [12, 13, 14, 15, 16, 17]        # 6 hours (day tariff)
    evening: [18, 19, 20, 21]                # 4 hours (day tariff 07-22)

  # Features used per segment (aggregated as segment means)
  features:
    - wind_mean              # Mean wind speed in segment hours
    - solar_mean             # Mean solar irradiance
    - hdd_mean               # Mean heating degree days
    - se3_mean               # Mean SE3 neighbor price (raw EUR/MWh)
    - se1_mean               # Mean SE1 neighbor price (raw EUR/MWh)
    - nuclear_deficit        # Nuclear capacity deficit (0-1)
    - is_workday             # Binary: weekday and not holiday
    - month_sin              # sin(2*pi*month/12)
    - month_cos              # cos(2*pi*month/12)
    - wind_log_scarcity      # log1p(max(0, base - wind_speed))
    # v2.2: net-load aggregates per segment
    - net_load_mean          # Mean net_load_gw in segment hours
    - net_load_squared_mean  # Mean (net_load_gw - 6)^2 in segment hours
